apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: codesage-ai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-web
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: codesage-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codesage-ai
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-api
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: codesage-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codesage-ai
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-ml
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: codesage-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codesage-ai
      app.kubernetes.io/component: ml
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [codesage-ai]
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker, score-worker]
      ports:
        - protocol: TCP
          port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-acme-solver
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: codesage-ai
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8089
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-and-keda-to-redis
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: codesage-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codesage-ai
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [codesage-ai]
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker, score-worker]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
          podSelector:
            matchLabels:
              app: keda-operator
        # Grafana Alloy reads the queue lengths (monitoring-values.yaml).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: grafana-k8s-monitoring-alloy
      ports:
        - protocol: TCP
          port: 6379
