apiVersion: batch/v1
kind: Job
metadata:
  name: codesage-migrate
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: codesage-ai
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codesage-ai
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: codesage-ai
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/jpabasara/codesage-ai/api:latest
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          env:
            - name: CODESAGE_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codesage-secrets
                  key: CODESAGE_MIGRATION_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
