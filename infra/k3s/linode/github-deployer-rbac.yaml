apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: github-deployer
    app.kubernetes.io/part-of: codesage-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: github-deployer
    app.kubernetes.io/part-of: codesage-ai
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: github-deployer
    app.kubernetes.io/part-of: codesage-ai
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: codesageai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
