apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-worker-redis-auth
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: codesage-ai
spec:
  secretTargetRef:
    - parameter: address
      name: codesage-secrets
      key: CODESAGE_KEDA_REDIS_ADDRESS
    - parameter: username
      name: codesage-secrets
      key: CODESAGE_KEDA_REDIS_USERNAME
    - parameter: password
      name: codesage-secrets
      key: CODESAGE_KEDA_REDIS_PASSWORD
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-redis-scaler
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: codesage-ai
spec:
  scaleTargetRef:
    name: worker
  # One worker stays warm so a scan starts at once. No idleReplicaCount:
  # with it set to 0, KEDA would still scale to zero when the queue is empty.
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
    # The `scans` list holds only WAITING scans: a worker takes one at a time
    # (concurrency 1, prefetch 1) and that scan leaves the list. Scaling on the
    # raw length (one worker per waiting scan) therefore needed two scans
    # waiting before a second worker started, so a second scan always queued
    # behind the first. Any scan waiting means every worker is busy, so go
    # straight to the maximum; at three workers further scans wait their turn.
    scalingModifiers:
      formula: "scans > 0 ? 3 : 1"
      target: "1"
      metricType: "AverageValue"
  triggers:
    - type: redis
      name: scans
      metadata:
        listName: scans
        listLength: "1"
        activationListLength: "0"
        enableTLS: "false"
        databaseIndex: "0"
      authenticationRef:
        name: keda-worker-redis-auth
