apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-worker-redis-auth
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: codesage-ai
spec:
  secretTargetRef:
    - parameter: address
      name: codesage-secrets
      key: CODESAGE_KEDA_REDIS_ADDRESS
    - parameter: username
      name: codesage-secrets
      key: CODESAGE_KEDA_REDIS_USERNAME
    - parameter: password
      name: codesage-secrets
      key: CODESAGE_KEDA_REDIS_PASSWORD
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-redis-scaler
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: codesage-ai
spec:
  scaleTargetRef:
    name: worker
  # One worker stays warm so a scan starts at once. No idleReplicaCount:
  # with it set to 0, KEDA would still scale to zero when the queue is empty.
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
  triggers:
    - type: redis
      metadata:
        listName: scans
        listLength: "1"
        activationListLength: "0"
        enableTLS: "false"
        databaseIndex: "0"
      authenticationRef:
        name: keda-worker-redis-auth
