apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-worker-redis-auth
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: codesage-ai
spec:
  secretTargetRef:
    - parameter: address
      name: codesage-secrets
      key: CODESAGE_KEDA_REDIS_ADDRESS
    - parameter: username
      name: codesage-secrets
      key: CODESAGE_KEDA_REDIS_USERNAME
    - parameter: password
      name: codesage-secrets
      key: CODESAGE_KEDA_REDIS_PASSWORD
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-redis-scaler
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: codesage-ai
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
  # One worker per workspace with a scan to run, up to 3. The API and the
  # workers keep `codesage:scan-demand` at one entry per runnable scan slot, so
  # one workspace's queue, which runs one scan at a time, never brings up
  # workers that could only wait. A workspace holds at most
  # `max_running_scans_per_workspace` entries.
  triggers:
    - type: redis
      name: demand
      metadata:
        listName: "codesage:scan-demand"
        listLength: "1"
        activationListLength: "0"
        enableTLS: "false"
        databaseIndex: "0"
      authenticationRef:
        name: keda-worker-redis-auth
