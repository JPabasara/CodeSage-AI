apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: codesage-ai
spec:
  # No `replicas`: KEDA owns the pod count (keda-*.yaml).
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: codesage-ai
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codesage-ai
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: codesage-ai
    spec:
      # Longer than the scan's 31-minute hard limit
      # (CODESAGE_SCAN_TIME_LIMIT_SECONDS=1860), so a scale-down or deploy lets
      # Celery finish the running scan instead of killing it. Change the two
      # together.
      terminationGracePeriodSeconds: 1920
      containers:
        - name: worker
          image: ghcr.io/jpabasara/codesage-ai/api:latest
          imagePullPolicy: IfNotPresent
          # `args` only: `command` would replace the image's tini ENTRYPOINT.
          args:
            - "celery"
            - "-A"
            - "codesage_api.worker"
            - "worker"
            - "--loglevel=INFO"
            - "--concurrency=1"
            - "-Q"
            - "scans"
            - "--hostname=scan-worker@%h"
          envFrom:
            - configMapRef:
                name: codesage-config
            - secretRef:
                name: codesage-secrets
          env:
            - name: CODESAGE_CLONE_DIR
              value: /var/tmp/codesage-clones
            - name: CODESAGE_CK_JAR
              value: /opt/ck/ck.jar
            # CK's JVM sizes its heap from the container limit. 60% of 1280Mi
            # keeps the 768 MB heap it had under the old 3Gi limit.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60
          volumeMounts:
            - name: clone-scratch
              mountPath: /var/tmp/codesage-clones
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A codesage_api.worker inspect ping -d scan-worker@$HOSTNAME -t 10 | grep -q pong
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A codesage_api.worker inspect ping -d scan-worker@$HOSTNAME -t 10 | grep -q pong
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A codesage_api.worker inspect ping -d scan-worker@$HOSTNAME -t 10 | grep -q pong
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 1280Mi
      volumes:
        - name: clone-scratch
          emptyDir:
            # Repositories up to 500 MB; going over this evicts the pod mid-scan.
            sizeLimit: 6Gi
