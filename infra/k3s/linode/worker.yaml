apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: codesage-ai
spec:
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: codesage-ai
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codesage-ai
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: codesage-ai
    spec:
      terminationGracePeriodSeconds: 1920
      containers:
        - name: worker
          image: ghcr.io/jpabasara/codesage-ai/api:latest
          imagePullPolicy: IfNotPresent
          args:
            - "celery"
            - "-A"
            - "codesage_api.worker"
            - "worker"
            - "--loglevel=INFO"
            - "--concurrency=1"
            - "-Q"
            - "scans"
            - "--hostname=scan-worker@%h"
          envFrom:
            - configMapRef:
                name: codesage-config
            - secretRef:
                name: codesage-secrets
          env:
            - name: CODESAGE_CLONE_DIR
              value: /var/tmp/codesage-clones
            - name: CODESAGE_CK_JAR
              value: /opt/ck/ck.jar
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60
          volumeMounts:
            - name: clone-scratch
              mountPath: /var/tmp/codesage-clones
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A codesage_api.worker inspect ping -d scan-worker@$HOSTNAME -t 10 | grep -q pong
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A codesage_api.worker inspect ping -d scan-worker@$HOSTNAME -t 10 | grep -q pong
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          # Restart only a worker that has not answered for ~10 minutes. A busy
          # scan can starve the ping on a saturated node; a stricter probe killed
          # scans mid-run, and a scan has its own time limits anyway.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A codesage_api.worker inspect ping -d scan-worker@$HOSTNAME -t 20 | grep -q pong
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 1280Mi
      volumes:
        - name: clone-scratch
          emptyDir:
            sizeLimit: 6Gi
