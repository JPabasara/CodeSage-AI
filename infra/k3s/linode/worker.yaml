apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: codesageai
  labels:
    app.kubernetes.io/name: codesage-ai
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: codesage-ai
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: codesage-ai
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codesage-ai
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: codesage-ai
    spec:
      terminationGracePeriodSeconds: 600
      containers:
        - name: worker
          image: ghcr.io/jpabasara/codesage-ai/api:latest
          imagePullPolicy: Always
          command: ["celery"]
          args:
            - "-A"
            - "codesage_api.worker"
            - "worker"
            - "--loglevel=INFO"
            - "--concurrency=1"
            - "-Q"
            - "scans"
            - "--hostname=scan-worker@%h"
          envFrom:
            - configMapRef:
                name: codesage-config
            - secretRef:
                name: codesage-secrets
          env:
            - name: CODESAGE_CLONE_DIR
              value: /var/tmp/codesage-clones
            - name: CODESAGE_CK_JAR
              value: /opt/ck/ck.jar
          volumeMounts:
            - name: clone-scratch
              mountPath: /var/tmp/codesage-clones
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A codesage_api.worker inspect ping -d scan-worker@$HOSTNAME -t 10 | grep -q pong
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A codesage_api.worker inspect ping -d scan-worker@$HOSTNAME -t 10 | grep -q pong
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A codesage_api.worker inspect ping -d scan-worker@$HOSTNAME -t 10 | grep -q pong
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: clone-scratch
          emptyDir:
            sizeLimit: 4Gi
