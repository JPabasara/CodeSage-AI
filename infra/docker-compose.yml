# Code Sage AI — local stack (SAD §7 deployment view).
#
# Six containers. `api` and `worker` are the SAME IMAGE with different commands.
# Only `web` and `api` are published to the host; redis, postgres and ml stay on
# the private network and are never publicly exposed.

name: codesage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codesage
      POSTGRES_USER: codesage_owner
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesage_owner -d codesage"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Deliberately NOT published to the host. Reach it with:
    #   docker compose exec postgres psql -U codesage_owner codesage
    # An open database port is the single easiest thing to forget before a demo.
    # If you need it from the host for a moment, use an override file rather
    # than editing this one — see infra/README or the work plan, step 3.6.

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published — broker traffic never leaves the private network.

  ml:
    build:
      context: ../apps/ml
    volumes:
      # Artifacts are mounted, not baked in, so swapping a model is a restart.
      - ../apps/ml/models:/models:ro
    healthcheck:
      # python:3.12-slim ships neither curl nor wget, and adding one just to ask
      # a question Python can ask itself would be a layer for nothing.
      # urlopen raises on any non-2xx, so a bad status is already a failure.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Not published. Workers call it by service name.

  migrate:
    build:
      context: ../apps/api
    command: alembic upgrade head
    environment:
      CODESAGE_MIGRATION_DATABASE_URL: postgresql+psycopg://codesage_owner:devpassword@postgres:5432/codesage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../apps/api
    environment:
      CODESAGE_DATABASE_URL: postgresql+psycopg://codesage_app:devpassword@postgres:5432/codesage
      # ⚠️ A SECOND URL, AND A DIFFERENT ROLE ON PURPOSE.
      # `codesage_app` cannot create tables, and must not be able to — it is the
      # role Row-Level Security applies to (infra/postgres/init/01-init.sql).
      # Migrations therefore run as the owner. Without this line alembic falls
      # back to the default in config.py, which points at localhost:5432 with
      # the password "changeme", and `alembic upgrade head` fails inside the
      # container with a connection error that looks like a networking problem
      # and is not one.
      CODESAGE_MIGRATION_DATABASE_URL: postgresql+psycopg://codesage_owner:devpassword@postgres:5432/codesage
      CODESAGE_REDIS_URL: redis://redis:6379/0
      CODESAGE_ML_SERVICE_URL: http://ml:8001
      CODESAGE_GITHUB_TOKEN: ${CODESAGE_GITHUB_TOKEN:-}
      CODESAGE_CORS_ORIGINS: '["http://localhost:3000"]'
      CODESAGE_SECRET_KEY: dev-only-change-me
      # ── Sign-in. The two blank ones come from infra/.env, which is never
      #    committed. Fill them in at the work plan, step 3.10.
      CODESAGE_ASGARDEO_BASE_URL: ${CODESAGE_ASGARDEO_BASE_URL:-}
      CODESAGE_ASGARDEO_CLIENT_ID: ${CODESAGE_ASGARDEO_CLIENT_ID:-}
      CODESAGE_ASGARDEO_CLIENT_SECRET: ${CODESAGE_ASGARDEO_CLIENT_SECRET:-}
      CODESAGE_ASGARDEO_REDIRECT_URI: http://localhost:8000/api/auth/callback
      CODESAGE_FRONTEND_BASE_URL: http://localhost:3000
      # Local development is plain http, so a Secure-only cookie would never be
      # sent at all. This MUST be true anywhere real.
      CODESAGE_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    healthcheck:
      # Liveness, not readiness — deliberately. /api/healthz answers "is the
      # process up?" and checks nothing else, so a database blip cannot make an
      # orchestrator restart a perfectly healthy API container. /readyz is the
      # one that checks Postgres and Redis; use it by hand when diagnosing, not
      # as the restart trigger. (See routers/system.py, which says the same.)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../apps/api
    command: celery -A codesage_api.worker worker --loglevel=INFO --concurrency=1
    init: true
    stop_grace_period: 30s
    environment:
      CODESAGE_DATABASE_URL: postgresql+psycopg://codesage_app:devpassword@postgres:5432/codesage
      CODESAGE_REDIS_URL: redis://redis:6379/0
      CODESAGE_ML_SERVICE_URL: http://ml:8001
      CODESAGE_CLONE_DIR: /var/tmp/codesage-clones
      CODESAGE_CK_JAR: /opt/ck/ck.jar
    volumes:
      # ~2 GB of scratch per concurrent scan. A named volume rather than the
      # container's writable layer, so a large clone cannot bloat the image layer.
      - clones:/var/tmp/codesage-clones
    healthcheck:
      # The worker serves no HTTP — there is no port to poll. Celery's own
      # answer is `inspect ping`, which goes out over the broker and comes back
      # "pong", so a green tick here means the worker is genuinely reachable on
      # Redis rather than merely a process that has not exited yet.
      # Slower interval and a long start_period: this costs a broker round trip,
      # and Celery takes its time connecting.
      test: ["CMD-SHELL", "celery -A codesage_api.worker inspect ping -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Concurrency scales by replicas, not threads: each scan needs its own clone
    # and its own ~2 GB. PERF-07 asks for at least three concurrent analyses.
    # Run `docker compose up --scale worker=3` to meet it.

  web:
    build:
      context: ../apps/web
      args:
        # ⚠️ A BUILD ARGUMENT, NOT AN ENVIRONMENT VARIABLE — and the difference
        # is not cosmetic. Next.js replaces every NEXT_PUBLIC_* reference with a
        # string literal while `next build` runs, so by the time a container
        # starts, the address is already inside the JavaScript the browser
        # downloads. It was written here as `environment:` until 20 Aug 2026,
        # which did nothing at all: the image still pointed at localhost:8000
        # wherever it was deployed. Moving it to `args:` is what makes the
        # frontend deployable somewhere other than a laptop.
        #
        # Changing this means rebuilding: `docker compose build web`.
        NEXT_PUBLIC_API_BASE_URL: ${CODESAGE_WEB_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  clones:
