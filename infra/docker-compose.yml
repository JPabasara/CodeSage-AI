
name: codesage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codesage
      POSTGRES_USER: codesage_owner
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesage_owner -d codesage"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    build:
      context: ../apps/ml
    volumes:
      - ../apps/ml/models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: ../apps/api
    command: alembic upgrade head
    environment:
      CODESAGE_MIGRATION_DATABASE_URL: postgresql+psycopg://codesage_owner:devpassword@postgres:5432/codesage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    dns:
      - 1.1.1.1
      - 8.8.8.8
    build:
      context: ../apps/api
    environment:
      CODESAGE_DATABASE_URL: postgresql+psycopg://codesage_app:devpassword@postgres:5432/codesage
      CODESAGE_MIGRATION_DATABASE_URL: postgresql+psycopg://codesage_owner:devpassword@postgres:5432/codesage
      CODESAGE_REDIS_URL: redis://redis:6379/0
      CODESAGE_ML_SERVICE_URL: http://ml:8001
      CODESAGE_GITHUB_TOKEN: ${CODESAGE_GITHUB_TOKEN:-}
      CODESAGE_CORS_ORIGINS: '["http://localhost:3000"]'
      CODESAGE_SECRET_KEY: dev-only-change-me
      CODESAGE_ASGARDEO_BASE_URL: ${CODESAGE_ASGARDEO_BASE_URL:-}
      CODESAGE_ASGARDEO_CLIENT_ID: ${CODESAGE_ASGARDEO_CLIENT_ID:-}
      CODESAGE_ASGARDEO_CLIENT_SECRET: ${CODESAGE_ASGARDEO_CLIENT_SECRET:-}
      CODESAGE_ASGARDEO_REDIRECT_URI: http://localhost:8000/api/auth/callback
      CODESAGE_FRONTEND_BASE_URL: http://localhost:3000
      CODESAGE_RESEND_API_KEY: ${CODESAGE_RESEND_API_KEY:-}
      CODESAGE_INVITATION_FROM_EMAIL: '${CODESAGE_INVITATION_FROM_EMAIL:-CodeSage <onboarding@resend.dev>}'
      CODESAGE_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    dns:
      - 1.1.1.1
      - 8.8.8.8
    build:
      context: ../apps/api
    command: celery -A codesage_api.worker worker --loglevel=INFO --concurrency=1 -Q scans
    init: true
    stop_grace_period: 30s
    environment:
      CODESAGE_DATABASE_URL: postgresql+psycopg://codesage_app:devpassword@postgres:5432/codesage
      CODESAGE_REDIS_URL: redis://redis:6379/0
      CODESAGE_ML_SERVICE_URL: http://ml:8001
      CODESAGE_CLONE_DIR: /var/tmp/codesage-clones
      CODESAGE_CK_JAR: /opt/ck/ck.jar
      CODESAGE_PMD_ENABLED: ${CODESAGE_PMD_ENABLED:-false}
      CODESAGE_DETECTOR_PROVIDER: ${CODESAGE_DETECTOR_PROVIDER:-codesage_api.detection.pmd:scan}
      CODESAGE_PMD_BIN: /opt/pmd/bin/pmd
    volumes:
      - clones:/var/tmp/codesage-clones
    healthcheck:
      test: ["CMD-SHELL", "celery -A codesage_api.worker inspect ping -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  score-worker:
    dns:
      - 1.1.1.1
      - 8.8.8.8
    build:
      context: ../apps/api
    command: celery -A codesage_api.worker worker --loglevel=INFO --concurrency=1 -Q scoring
    init: true
    stop_grace_period: 30s
    environment:
      CODESAGE_DATABASE_URL: postgresql+psycopg://codesage_app:devpassword@postgres:5432/codesage
      CODESAGE_REDIS_URL: redis://redis:6379/0
      CODESAGE_ML_SERVICE_URL: http://ml:8001
      CODESAGE_CLONE_DIR: /var/tmp/codesage-clones
      CODESAGE_CK_JAR: /opt/ck/ck.jar
      CODESAGE_PMD_ENABLED: ${CODESAGE_PMD_ENABLED:-false}
      CODESAGE_DETECTOR_PROVIDER: ${CODESAGE_DETECTOR_PROVIDER:-codesage_api.detection.pmd:scan}
      CODESAGE_PMD_BIN: /opt/pmd/bin/pmd
    healthcheck:
      test: ["CMD-SHELL", "celery -A codesage_api.worker inspect ping -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${CODESAGE_WEB_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  dozzle:
    profiles: ["observability"]
    image: ghcr.io/amir20/dozzle:v10.7.5
    environment:
      DOZZLE_FILTER: "label=com.docker.compose.project=codesage"
      DOZZLE_HOSTNAME: "CodeSage local"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  redisdata:
  clones:
