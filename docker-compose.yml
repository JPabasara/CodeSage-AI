version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: codesage-redis
    ports:
      - "6379:6379"
    restart: always

  celery_worker:
    build:
      context: ./apps/ml
      dockerfile: Dockerfile
    container_name: codesage-celery-worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always
