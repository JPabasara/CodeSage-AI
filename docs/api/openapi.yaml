openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# Code Sage AI — the data contract.
#
# THIS FILE IS NORMATIVE. It is the single source of truth for every shape that
# crosses the browser/backend boundary (SRS SP-4, SRS Appendix B).
#
#   frontend :  apps/web/src/lib/types is GENERATED from this file.
#               `pnpm gen:types` — never hand-edit the generated output.
#   backend  :  Pydantic models must match. CI diffs FastAPI's /openapi.json
#               against this file; a divergence fails the build.
#
# Written spec-first, because the frontend was built against a mock backend and
# the API handlers are still skeletons. When the backend is complete and trusted,
# this file may be generated from it instead — but the diff check stays either way.
#
# ── Conventions, all settled decisions ──────────────────────────────────────
#
#   snake_case            every field name, and every path parameter. Matches the
#                         SRS field vocabulary and the database columns, so one
#                         name survives from PostgreSQL to the browser.
#   session cookie        FastAPI is the BFF. It completes the Asgardeo OIDC flow
#                         and hands the browser an httpOnly cookie. No token ever
#                         reaches client JavaScript (SEC-08, SEC-09).
#   five categories       code-design · requirement · documentation · test ·
#                         security. SATDAUG carries no `defect_debt` label, so
#                         ML-1 cannot predict that category and it does not exist.
#   six numbers           a scoring profile is five weights plus one trust slider.
#   derived on read       every score in this document is computed per request
#                         under the active profile. A valid profile- and
#                         formula-stamped derived summary cache may be reused
#                         (FR-21). This is why a profile change re-ranks with no
#                         re-scan, and why no endpoint takes a profile parameter.
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: Code Sage AI API
  version: 1.0.1
  summary: Technical-debt analytics for a connected Git repository.
  description: |
    The REST surface behind the Code Sage AI dashboard.

    **Reading this contract.** Endpoints fall into three groups that behave very
    differently, and the difference is the architecture:

    - **Reads** (`/projects`, `/branches`, `/health`, `/scans`) return stored facts
      with every score derived from stored facts under the workspace's active
      profile. Valid profile- and formula-stamped summary caches may be reused.
    - **The scan** (`POST /repos/{repo_id}/scan`) is asynchronous. It returns a
      `202` with a `scan_id` immediately and the client polls; the work happens on
      a Celery worker (PERF-03, PERF-05).
    - **The profile** (`PUT /profiles/active`) is a single idempotent write of six
      numbers. It touches no snapshot and starts no scan (FR-20, FR-21).

    **No endpoint accepts a scoring profile.** The active profile is server-side
    state scoped to the workspace, so `GET /repos/{repo_id}/health?branch=…` takes
    a branch and nothing else. Passing the profile in the query string would grow
    every read endpoint each time the profile changed shape, and would leak the
    scoring formula into the API surface.
  contact:
    name: Group 16 · Project ID 7 · CS3203
  license:
    name: Academic project — not licensed for redistribution

servers:
  - url: http://localhost:8000
    description: Local development (infra/docker-compose.yml)
  - url: https://api.codesage.dev
    description: Deployed

tags:
  - name: auth
    description: |
      Sign-in through **Asgardeo**, which federates GitHub as an identity provider.
      The application is an OIDC client of Asgardeo only and never performs a
      GitHub OAuth exchange itself — so adding Google or username/password later
      is an Asgardeo configuration change with no code here.
  - name: projects
    description: Connected repositories. v1.0 is public repositories by URL paste.
  - name: scans
    description: The asynchronous scan lifecycle.
  - name: dashboard
    description: The read path. Everything here is derived under the active profile.
  - name: profiles
    description: Scoring profiles — five category weights and one trust slider.
  - name: system
    description: Operational endpoints.

security:
  - sessionCookie: []

paths:

  # ══════════════════════════════════════════════════════════════════════════
  # AUTH  (SRS FR-1, SEC-01, SEC-10)
  # ══════════════════════════════════════════════════════════════════════════

  /api/auth/login:
    get:
      tags: [auth]
      operationId: begin_sign_in
      security: []
      summary: Begin sign-in
      description: |
        Redirects the browser to Asgardeo's authorization endpoint with a signed,
        single-use `state` value.

        **This is a navigation, not a fetch.** The frontend renders it as
        `<a href="/api/auth/login">`, never as an XHR — the browser has to leave
        the page for the OIDC flow to work. It is the one endpoint a mock service
        worker cannot intercept.

        The path carries no provider name: which identity provider the user picks
        is Asgardeo's business, not this API's.

        **Where to land afterwards.** `return_to` is kept inside the signed
        handshake cookie, never in the URL sent to Asgardeo, so Asgardeo's
        exact-URL checks are unaffected. Without one, a `return_to` from an
        unfinished sign-in in the same browser (up to an hour old) is carried
        forward. That is how the email-verification tab, which opens this URL
        fresh, still ends on the invitation the user came from.
      parameters:
        - name: return_to
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
          example: /invitations/accept?token=…
          description: |
            A relative path to open after sign-in. Only `/invitations/accept`,
            `/projects`, `/dashboard` and paths under `/dashboard/`, `/profiles`
            and `/workspace` are accepted, with an optional query. Anything else
            (an absolute URL, `//host`, a backslash, an encoded `//` or `..`, an
            unlisted path) is **ignored, not refused**, so there is no open
            redirect and no error page.
        - name: retry
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Set only by the callback's one silent retry. It marks this sign-in's
            `state`, so a retry that fails again ends on the login page instead
            of looping. Clients never send it.
      responses:
        '302':
          description: Redirect to the Asgardeo authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /api/auth/callback:
    get:
      tags: [auth]
      operationId: complete_sign_in
      security: []
      summary: OIDC redirect target
      description: |
        Asgardeo's redirect target. Validates `state`, exchanges the authorization
        code, and establishes a **server-side session**, returning its identifier
        in an httpOnly cookie. The browser never receives a token.

        On first sign-in this also creates the user's Workspace, its Membership,
        and seeds the **Balanced** profile with `is_active = true` — so a workspace
        always has exactly one active profile and the read path never needs a
        fallback.

        A `SecurityAuditRecord` is written for both success and failure (SEC-14).
        A failed sign-in has no established actor, which is exactly the event most
        worth recording.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
          description: Authorization code issued by Asgardeo.
        - name: state
          in: query
          required: true
          schema: { type: string }
          description: |
            The single-use nonce issued at `/api/auth/login`. Without checking it,
            the callback would accept an authorization code from anywhere, which
            is CSRF on the sign-in flow.
      responses:
        '302':
          description: |
            One of three redirects:

            - **Session established.** Redirects to the `return_to` given at
              `/api/auth/login` (checked against the allowlist again), otherwise
              to the Projects page. Sets the session cookie with `HttpOnly`,
              `Secure`, `SameSite=Lax`.
            - **Handshake missing, expired or mismatched** (typically: the user
              verified their email in another tab, or took longer than ten
              minutes). Restarts sign-in once, silently, at
              `/api/auth/login?retry=true`. The user still has an Asgardeo
              session, so no password is asked.
            - **The retry failed as well, or the code exchange was refused.**
              Redirects to `/login?error=expired|invalid|failed`. The retry is
              marked in `state`, which Asgardeo echoes back, so it can never
              loop, even in a browser that keeps no cookies.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
              example: codesage_session=…; HttpOnly; Secure; SameSite=Lax; Path=/
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /api/auth/session:
    get:
      tags: [auth]
      operationId: get_session
      summary: Who is signed in
      description: |
        Returns the signed-in user, or `401` if there is no valid session.

        This is the only auth endpoint the client calls with `fetch`, and it is how
        the app decides what to render: sign-in when this fails, **workspace
        onboarding** when `needs_workspace_setup` is true, and the dashboard
        otherwise.

        Reachable without a workspace — it is the endpoint that reports not having
        one.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

  /api/auth/workspaces:
    get:
      tags: [auth]
      operationId: list_active_workspaces
      summary: List the signed-in user's active workspaces
      description: |
        Returns only active memberships belonging to the authenticated user.
        Invited and inactive memberships, and every other user's memberships,
        are excluded. At most one item is `is_active`.

        Reachable without a workspace, where it returns an empty array — that is
        the state onboarding exists for.
      responses:
        '200':
          description: Active workspaces available to this session.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkspaceSummary' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
    post:
      tags: [auth]
      operationId: create_workspace
      summary: Create and select a workspace
      description: |
        Creates a workspace with the caller as its active org-admin, seeds the
        three built-in scoring profiles with **Balanced** as the default, and
        selects it for the current server-side session only. All of it in one
        transaction, so a half-created workspace cannot be reached.

        **No repository is created.** A new workspace is genuinely empty and the
        Projects page says so.

        Two callers, one endpoint. During onboarding the session has no workspace
        and being authenticated is the whole check — there is no workspace in which
        to hold a permission, and refusing here would leave the user permanently
        unable to start. Afterwards it is an ordinary org-admin operation in the
        workspace the caller is currently in, so a developer cannot create
        workspaces at will.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '201':
          description: The newly created and active workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSummary' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/workspaces/{workspace_id}:
    get:
      tags: [auth]
      operationId: get_workspace
      summary: The active workspace's settings
      description: |
        Name, description, website and the derived project and member counts.

        Only the **active** workspace is readable. Another workspace the caller
        belongs to returns `404`: the session binds one workspace, and reading
        another would mean reading outside the tenant this transaction is isolated
        to. Switch to it first.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The active workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSummary' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [auth]
      operationId: update_workspace
      summary: Update the active workspace
      description: |
        Requires org-admin access. A **partial** update: omitted fields are left
        alone. The path must identify the session's active workspace; another
        workspace returns `404` even if the caller belongs to it.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceRequest' }
      responses:
        '200':
          description: The updated active workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSummary' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/auth/workspaces/active:
    put:
      tags: [auth]
      operationId: switch_active_workspace
      summary: Switch the session's active workspace
      description: |
        Updates only the current server-side session after verifying that the
        authenticated user has an active membership in the requested workspace.
        A missing, inactive, invited, or foreign membership returns the same 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchWorkspaceRequest' }
      responses:
        '200':
          description: The newly active workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSummary' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/members:
    get:
      tags: [members]
      operationId: list_members
      summary: List workspace members and pending invitations
      responses:
        '200':
          description: Members and unexpired pending invitations in the active workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/invitations:
    post:
      tags: [members]
      operationId: create_invitation
      summary: Invite an email address to the active workspace
      description: |
        Creates the invitation and sends its one-time acceptance link through
        Resend. The transaction is rolled back if delivery cannot be requested.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Invitation created and submitted for email delivery. The URL is also returned for copying.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvitation' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /api/invitations/accept:
    post:
      tags: [members]
      operationId: accept_invitation
      summary: Accept an invitation as the signed-in, verified identity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '200':
          description: Membership activated with the role stored on the invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedInvitation' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/invitations/{invitation_id}:
    delete:
      tags: [members]
      operationId: revoke_invitation
      summary: Revoke a pending invitation
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Invitation revoked. }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/members/{membership_id}/role:
    patch:
      tags: [members]
      operationId: change_member_role
      summary: Change a workspace member's role
      parameters:
        - name: membership_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMemberRoleRequest' }
      responses:
        '200':
          description: Updated member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/members/{membership_id}:
    delete:
      tags: [members]
      operationId: deactivate_member
      summary: Deactivate a workspace membership
      parameters:
        - name: membership_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Membership deactivated. }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: sign_out
      security: []
      summary: End the session
      description: |
        Deletes the session **server-side**, clears the cookie, and redirects to
        Asgardeo's sign-out endpoint, which clears its own SSO cookie and sends the
        browser back to `/login` (SEC-10).

        This is why the session is server-side state rather than a self-contained
        JWT: a stateless token stays valid until it expires, and sign-out could not
        actually revoke it without a denylist — which is most of a session store
        anyway.

        **This is a navigation, not a fetch** — like `/api/auth/login`. Deleting our
        own session is not enough: Asgardeo keeps its own cookie, and it can only
        clear it if the browser actually visits it. The frontend therefore submits a
        `<form method="POST">` and lets the browser follow the redirect. A `fetch`
        stays on the page and cannot complete the flow.

        It stays a POST rather than a link because a GET is prefetchable, and
        something that ends a session must not fire because a browser guessed at a
        URL.

        **No session required** — deliberately. Sign-out is idempotent: signing out
        twice, or after the idle timeout, must still clear the cookie and still land
        somewhere sensible. Demanding a live session before allowing you to end one
        would leave the user holding a dead cookie with no way to drop it, so this
        endpoint never answers 401.
      responses:
        '302':
          description: |
            Signed out. The cookie is cleared and the browser is sent to Asgardeo's
            sign-out endpoint, which redirects on to `/login`.

            If sign-in is not configured on the server, the redirect goes straight to
            `/login`: the local session is gone either way, and an error page would be
            a worse answer than the login screen.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
              example: codesage_session=; Max-Age=0; Path=/

  # ══════════════════════════════════════════════════════════════════════════
  # PROJECTS  (SRS FR-3, FR-4)
  # ══════════════════════════════════════════════════════════════════════════

  /api/projects:
    get:
      tags: [projects]
      operationId: list_projects
      summary: List connected projects
      description: |
        Every repository connected to the caller's workspace. `latest_health` is a
        derived hint for the projects list and is absent until the project has at
        least one finalized snapshot.
      responses:
        '200':
          description: The connected projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Repo' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

    post:
      tags: [projects]
      operationId: connect_project
      summary: Connect a repository by URL
      description: |
        Validates the URL, reads the repository's metadata from GitHub, and records
        it against the workspace.

        **v1.0 accepts public repositories only.** A private URL returns
        `REPOSITORY_NOT_PUBLIC` with a message that explains why rather than saying
        "forbidden" — a user pasting their own repository has done nothing wrong
        and needs to know that private support requires a GitHub App installation,
        which is not in this release.

        **Guardrails (13H.1).** Two more refusals come from what GitHub already
        reports, so a repository CodeSage could never scan is refused before a
        project exists:

        - GitHub's `size` over the limit (300 MB by default) →
          `REPOSITORY_TOO_LARGE`;
        - no Java in GitHub's language list → `REPOSITORY_HAS_NO_JAVA`, with the
          languages GitHub did find in `languages`.

        Neither creates a project. The worker checks again at scan time, because
        the scanned branch can differ from what GitHub reports here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectRepoRequest' }
      responses:
        '201':
          description: Connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repo' }
        '400':
          description: |
            The URL is malformed, the repository is unreachable, it is private,
            it is too large, or it has no Java. Distinguish them by `code`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                too_large:
                  summary: Larger than the size limit
                  value:
                    detail: This repository is larger than 300 MB, the most CodeSage can analyse today.
                    code: REPOSITORY_TOO_LARGE
                no_java:
                  summary: No Java in the repository
                  value:
                    detail: We couldn't find any Java in this repository. CodeSage reads Java for now; more languages are coming soon.
                    code: REPOSITORY_HAS_NO_JAVA
                    languages: [Python, Shell]
                private:
                  summary: Private repository
                  value:
                    detail: Only public repositories can be connected in this release. Private repositories require a GitHub App installation.
                    code: REPOSITORY_NOT_PUBLIC
                unreachable:
                  summary: Not reachable
                  value:
                    detail: That repository could not be reached. Check the URL and try again.
                    code: REPOSITORY_UNREACHABLE
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '409':
          description: Already connected to this workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /api/projects/{repo_id}:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    delete:
      tags: [projects]
      operationId: remove_project
      summary: Remove a connected repository
      description: |
        Permanently removes the repository and all workspace-owned descendants,
        including branches, analysis attempts, snapshots, cached scores, source
        records, predictions, and findings.

        Requires `repository:disconnect`, which is granted only to org-admin and
        manager roles. Removal is refused while any scan for the repository is
        queued or running; clients switch on `REPOSITORY_SCAN_RUNNING` to explain why.
      responses:
        '204':
          description: Repository and all descendants removed successfully.
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The repository has a queued or running scan and cannot be removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                detail: Stop or wait for the queued or running scan before removing this repository.
                code: REPOSITORY_SCAN_RUNNING

  # ══════════════════════════════════════════════════════════════════════════
  # BRANCHES  (SRS FR-5)
  # ══════════════════════════════════════════════════════════════════════════

  /api/repos/{repo_id}/branches:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    get:
      tags: [dashboard]
      operationId: list_branches
      summary: Branches with head commit
      description: |
        Read from the GitHub REST API with ETag-conditional requests, so a repeated
        read usually costs no rate-limit quota.
      responses:
        '200':
          description: The repository's branches.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  # ══════════════════════════════════════════════════════════════════════════
  # DASHBOARD  (SRS FR-12 … FR-18, FR-21)
  # ══════════════════════════════════════════════════════════════════════════

  /api/repos/{repo_id}/health:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    get:
      tags: [dashboard]
      operationId: get_health_report
      summary: The full dashboard payload
      description: |
        One response carrying all six dashboard outputs (SRS Appendix B): the health
        card, the category breakdown, the trend, the Refactor-First list, the data
        behind the finding detail, and the hotspot tree.

        Every score is calculated asynchronously by the tenant-scoped Celery
        scoring worker and read from a complete profile- and engine-stamped derived
        cache. FastAPI does not execute the scoring formula. A profile change
        therefore re-ranks everything with no re-scan, and the trend is redrawn end
        to end so every point is comparable with every other (FR-14, FR-21).

        **There is no profile parameter, by design.** See the description at the top
        of this document.
      parameters:
        - name: branch
          in: query
          required: true
          schema: { type: string }
          description: Branch name. Trends and deltas are per branch.
          example: main
        - name: snapshot_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: |
            Load a specific historical snapshot instead of the newest one (FR-19).
            Omit for the latest. Only snapshots produced by a **successful** scan
            are addressable — a cancelled or failed attempt produces no snapshot.
      responses:
        '200':
          description: The dashboard payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No repository, no such branch, or the branch has never been scanned
            successfully. The client renders the empty state, not an error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ScorePending' }

  /api/repos/{repo_id}/scans:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    get:
      tags: [dashboard]
      operationId: list_scan_history
      summary: Scan history
      description: |
        The stored snapshots for this repository, newest first (FR-19). Only
        successful scans appear — a cancelled or failed attempt is retained for
        diagnosis (SP-13) but is never presented as a result (DBR-22).

        `finding_count` and `commit_sha` are stored facts; `health_score`, `grade`
        and `delta` are derived on this request, which is why switching profiles
        redraws this list too.
      parameters:
        - name: branch
          in: query
          required: false
          schema: { type: string }
          description: Restrict to one branch. Omit for all branches.
      responses:
        '200':
          description: Snapshot summaries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScanSummary' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ══════════════════════════════════════════════════════════════════════════
  # SCAN LIFECYCLE  (SRS FR-6, PERF-03, PERF-05)
  # ══════════════════════════════════════════════════════════════════════════

  /api/repos/{repo_id}/scan:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    post:
      tags: [scans]
      operationId: start_scan
      summary: Start a scan
      description: |
        Enqueues an analysis and returns immediately with `202` — the work runs on a
        Celery worker, never inside this request (PERF-05). The job is on the queue
        within one second (PERF-03).

        **Skip-if-unchanged.** The API first reads the branch head SHA from GitHub
        and compares it with the SHA of the **last successful** scan of that branch.
        If they match, no job is queued and the response carries
        `phase: "done"` with the existing `scan_id`. Comparing against the last
        *successful* scan is what stops a cancelled attempt being mistaken for a
        stored snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartScanRequest' }
      responses:
        '202':
          description: |
            Queued, or skipped as unchanged. Poll `GET /api/repos/{repo_id}/scan/{scan_id}`
            once per second until `phase` is terminal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanStatus' }
              examples:
                queued:
                  summary: Queued
                  value:
                    scan_id: 6f1c2a3e-6d18-4f4a-9a1e-0f0f9f1b2c34
                    phase: queued
                    progress: 0
                    branch: main
                    commit_sha: 9fceb02d0ae598e95dc970b74767f19372d61af8
                    started_at: '2026-08-12T09:14:03Z'
                skipped:
                  summary: Head SHA unchanged — nothing to do
                  value:
                    scan_id: 2b7d4e11-88a0-4c3e-b2fb-5c9b1c1a77aa
                    phase: done
                    progress: 100
                    branch: main
                    commit_sha: 9fceb02d0ae598e95dc970b74767f19372d61af8
                    finished_at: '2026-08-12T08:02:55Z'
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A scan is already running for this branch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                detail: A scan is already running for this branch.
                code: SCAN_ALREADY_RUNNING
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/repos/{repo_id}/scan/active:
    parameters:
      - $ref: '#/components/parameters/RepoId'
    get:
      tags: [scans]
      operationId: get_active_scan
      summary: Find the scan still queued or running
      description: |
        A client learns a scan id only from the `POST` that started it. A page
        that was left and reopened, refreshed, opened in another tab or on
        another device, or a teammate's scan, would otherwise stay invisible
        until it finished. This returns that scan so the client can resume
        polling `GET …/scan/{scan_id}` and offer Stop.

        With `branch`, only that branch; without it, the newest active scan on
        any branch of the repository.
      parameters:
        - name: branch
          in: query
          required: false
          schema: { type: string, minLength: 1 }
          description: Restrict to one branch. Omit for any branch.
      responses:
        '200':
          description: The active scan's current phase and progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanStatus' }
        '204':
          description: No scan is queued or running.
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/repos/{repo_id}/scan/{scan_id}:
    parameters:
      - $ref: '#/components/parameters/RepoId'
      - $ref: '#/components/parameters/ScanId'
    get:
      tags: [scans]
      operationId: get_scan_status
      summary: Poll a scan
      description: |
        Polled once per second while a scan is active, and stopped as soon as
        `phase` is `done`, `error` or `cancelled` (SRS Table 3.107). No WebSockets
        and no Server-Sent Events in v1.0.

        **The two fields come from two different stores.** `phase` is read from
        PostgreSQL and `progress` from Redis. Losing a percentage when the broker
        restarts costs nothing — the next poll produces a new one. Losing the fact
        that a scan failed would breach SP-13, which requires the terminal phase and
        its error message to be recoverable from the database alone.
      responses:
        '200':
          description: Current phase and progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanStatus' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/repos/{repo_id}/scan/{scan_id}/stop:
    parameters:
      - $ref: '#/components/parameters/RepoId'
      - $ref: '#/components/parameters/ScanId'
    post:
      tags: [scans]
      operationId: stop_scan
      summary: Cancel a running scan
      description: |
        **Cancellation is cooperative, not forced.** This sets a flag in Redis and
        returns immediately; it does not kill the worker. The worker reads the flag
        **between pipeline stages**, stops at the first boundary it reaches, deletes
        its clone and writes `phase: "cancelled"`.

        Consequences worth knowing:

        - The response is `202`, and `phase` is usually still `running`. The client
          learns the scan really stopped from the **next poll**, not from this call.
        - A user who presses Stop waits until the current stage ends. That is the
          price of never leaving a half-written snapshot.
        - Once finalization begins the scan completes. FR-6 requires the previous
          snapshot to survive a cancellation intact, and a killed write would leave
          a partial one.
        - The terminal phase is `cancelled`, **not** `idle`, so a scan that was
          stopped stays distinguishable from one that never ran.
      responses:
        '202':
          description: |
            Cancellation requested. Keep polling until `phase` becomes `cancelled`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanStatus' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The scan already reached a terminal phase, or finalization has begun and
            is past the last cancellation checkpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                detail: This scan can no longer be cancelled.
                code: SCAN_NOT_CANCELLABLE

  # ══════════════════════════════════════════════════════════════════════════
  # PROFILES  (SRS FR-20, FR-21, FR-24)
  # ══════════════════════════════════════════════════════════════════════════

  /api/profiles:
    get:
      tags: [profiles]
      operationId: list_profiles
      summary: The workspace profile pool
      description: |
        Every profile this workspace can score with: the three built-ins —
        **Balanced**, **Security-first**, **Delivery-speed** — followed by up to
        five custom profiles the team authored.

        Each entry says what it is (`is_preset`), whether it is the workspace
        default (`is_active`), how many projects name it explicitly
        (`usage_count`) and whether it can be changed at all (`editable`), so the
        Profiles screen can render the whole pool from one request.

        Built-ins do **not** count toward the five-custom limit.
      responses:
        '200':
          description: The pool, built-ins first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScoreProfile' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [profiles]
      operationId: create_profile
      summary: Create a custom profile
      description: |
        Adds one profile to the pool. It does **not** become the default — that is
        a separate, deliberate choice via `PUT /api/profiles/default`.

        A workspace holds at most **five** custom profiles. The sixth is refused
        with `PROFILE_LIMIT_REACHED`, and the count is serialised in the database,
        so two clients creating the sixth at the same moment cannot both succeed.

        Names are unique per workspace after trimming and lower-casing; a clash
        returns `PROFILE_NAME_CONFLICT`. Out-of-range weights are clamped and
        returned as stored, the same as everywhere else in this contract.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProfileRequest' }
      responses:
        '201':
          description: The profile as stored, after clamping.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreProfile' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The pool is full, or the name is taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                limit:
                  value:
                    detail: A workspace can hold at most five custom scoring profiles.
                    code: PROFILE_LIMIT_REACHED
                name:
                  value:
                    detail: Another profile in this workspace already uses that name.
                    code: PROFILE_NAME_CONFLICT
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/profiles/default:
    get:
      tags: [profiles]
      operationId: get_default_profile
      summary: The workspace default
      description: |
        The profile every project without an explicit override is scored with.
      responses:
        '200':
          description: The workspace default.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreProfile' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

    put:
      tags: [profiles]
      operationId: set_default_profile
      summary: Choose the workspace default
      description: |
        Points the workspace at any profile in its own pool, built-in or custom.
        Replaces the whole selection rather than amending it, so re-sending the
        same id is a no-op.

        **This starts no scan.** Every project that inherits the default is
        re-scored from snapshots it already has; no `SNAPSHOT`, `FINDING` or
        `ANALYSIS_ATTEMPT` row is written. A profile is not a commit.

        A `profile_id` from another workspace answers `404`, the same as an id
        that exists nowhere.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectProfileRequest' }
      responses:
        '200':
          description: The profile now in force for the workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreProfile' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/profiles/{profile_id}:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [profiles]
      operationId: get_profile
      summary: One profile
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreProfile' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [profiles]
      operationId: update_profile
      summary: Change a custom profile
      description: |
        A **partial** update: send only what changed. Omitted fields keep their
        stored value, which is what makes this safe to call from a form that only
        tracks edits.

        **Built-ins are refused** with `PROFILE_BUILT_IN`. They are immutable in
        the database too, by trigger, so this is a courtesy rather than the
        enforcement point.

        Editing a profile changes what every project using it scores — that is the
        point of a shared pool, and it is deliberate. Those projects are re-scored
        from existing snapshots; no scan is started.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: The profile as stored, after clamping.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreProfile' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A built-in was addressed, or the new name is taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                built_in:
                  value:
                    detail: Built-in profiles cannot be edited or deleted. Clone one instead.
                    code: PROFILE_BUILT_IN
                name:
                  value:
                    detail: Another profile in this workspace already uses that name.
                    code: PROFILE_NAME_CONFLICT
        '422': { $ref: '#/components/responses/ValidationFailed' }

    delete:
      tags: [profiles]
      operationId: delete_profile
      summary: Delete a custom profile
      description: |
        Only an **unused** custom profile can be deleted. A profile that is the
        workspace default, or that any project has chosen, returns
        `PROFILE_IN_USE` — change those selections first. Built-ins return
        `PROFILE_BUILT_IN`.

        Both refusals are backed by the database: the two foreign keys pointing at
        a profile would reject the delete anyway, so there is no window in which a
        project could be left pointing at nothing.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The profile is built-in, or still in use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                in_use:
                  value:
                    detail: >-
                      This profile is the workspace default or is assigned to a
                      project. Change those selections before deleting it.
                    code: PROFILE_IN_USE
                built_in:
                  value:
                    detail: Built-in profiles cannot be edited or deleted. Clone one instead.
                    code: PROFILE_BUILT_IN

  /api/projects/{repo_id}/profile:
    parameters:
      - name: repo_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [profiles]
      operationId: get_project_profile
      summary: What this project is scored with
      description: |
        The effective profile, whether it is inherited, the workspace default, and
        the explicit override if there is one — everything the project's settings
        panel needs, in one request.
      responses:
        '200':
          description: The project's effective profile and where it came from.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectProfile' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [profiles]
      operationId: set_project_profile
      summary: Override the default for this project
      description: |
        Gives one project a profile of its own, chosen from **this workspace's**
        pool. A project has at most one override — `repository_id` is the primary
        key of the assignment table — so this replaces any previous choice rather
        than adding to it, and re-sending the same id is a no-op.

        A `profile_id` from another workspace answers `404`. The database could not
        store it either: the assignment's foreign keys both travel through
        `workspace_id`, which makes a cross-workspace reference unrepresentable
        rather than merely rejected.

        **This starts no scan.** The project is re-scored from snapshots it already
        has.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectProfileRequest' }
      responses:
        '200':
          description: The project's profile after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectProfile' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

    delete:
      tags: [profiles]
      operationId: clear_project_profile
      summary: Go back to inheriting the default
      description: |
        Removes the override so the project follows the workspace default again.
        Idempotent: clearing a project that has no override succeeds and returns
        the same inherited state.
      responses:
        '200':
          description: The project's profile, now inherited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectProfile' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/profiles/active:
    get:
      tags: [profiles]
      operationId: get_active_profile
      summary: The active profile (superseded)
      description: |
        **Superseded by `GET /api/profiles/default`**, which it now answers
        identically. Kept until the web moves over.

        The profile currently in force for the workspace. The Profiles screen reads
        this on load, so the sliders always open showing what is really applied
        rather than a client-side guess.
      responses:
        '200':
          description: The active profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreProfile' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

    put:
      tags: [profiles]
      operationId: apply_profile
      summary: Apply a profile (superseded)
      description: |
        **Superseded by `POST /api/profiles` plus `PUT /api/profiles/default`**,
        which separate "author a profile" from "choose the one in force". Kept
        until the web moves over.

        Values that are exactly a built-in's now *select* that built-in rather than
        writing to it; anything else is written to the workspace's own custom
        profile. The response is the profile in force either way.

        Replaces the workspace's active profile with exactly the submitted values.

        **PUT, not PATCH.** The body carries the **complete** profile — six numbers,
        never a delta. That makes the write idempotent, so retrying after a dropped
        response cannot leave a half-applied profile. It matters here specifically
        because the client fires a dependent read (`GET …/health`) immediately
        afterwards, and a half-applied profile would render a dashboard matching no
        profile the system actually holds.

        **Nothing is sent while the user drags.** Slider positions are client state
        until **Apply** is pressed. A single drag crosses many intermediate values;
        writing each one would put a write and a full re-derivation on the server
        per pixel of travel, and would leave the user no way to abandon an
        experiment.

        **Out-of-range weights are clamped, not rejected.** A weight of `9.0` is
        stored as `3.0` and returned as `3.0` with `200` — the response is the
        profile as it is *really in force*, which is what lets the client confirm
        what was saved instead of trusting what it sent. A **malformed** body (wrong
        type, missing key, unknown category) is a different thing and returns `422`.

        **The same row is updated every time; profiles are not versioned.** Applying
        a profile overwrites the workspace's single `SCORING_PROFILE` row in place —
        its `id` never changes and no history is kept. There is deliberately no
        version column: no endpoint in this contract can express or return one, so
        accumulating a row per Apply would grow the table without bound for a
        history nothing is able to read. Scores are derived on read (FR-21), so a
        superseded profile also explains no stored result.

        **This writes no snapshot and starts no scan.** Six numbers change on that
        one row, in one transaction. No
        `FINDING`, no `SNAPSHOT`, no `ANALYSIS_ATTEMPT` row is touched. A snapshot is
        keyed by commit SHA and records what the code was; a profile is not a commit.
        Were a profile change to write one, the trend chart would show a step on a
        day nobody touched the code (FR-21).

        **The visibility floor holds regardless** (FR-24). No weight, including the
        minimum `0.1` on `security`, can push a critical security finding out of
        sight — such findings come back with `pinned_by_floor: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyProfileRequest' }
            examples:
              security_first:
                summary: The Security-first preset
                value:
                  name: Security-first
                  weights:
                    security: 3.0
                    code_design: 1.0
                    requirement: 0.8
                    documentation: 0.5
                    test: 1.0
                  trust_s: 0.5
      responses:
        '200':
          description: |
            The profile **as stored**, after clamping. Compare it with what you sent:
            a differing value means it was out of range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreProfile' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ══════════════════════════════════════════════════════════════════════════
  # SYSTEM
  # ══════════════════════════════════════════════════════════════════════════

  /api/healthz:
    get:
      tags: [system]
      operationId: liveness
      security: []
      summary: Liveness probe
      description: Container orchestration only. Does not touch the database.
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

# ═══════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════════════════

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: codesage_session
      description: |
        An httpOnly, Secure, SameSite=Lax cookie holding a **server-side session
        identifier** — not a token, and not readable by JavaScript.

        FastAPI is the BFF: it completes the Asgardeo OIDC flow, keeps the tokens
        server-side, and hands the browser only this cookie. Two consequences: an
        XSS bug cannot steal a credential that JavaScript cannot read (SEC-09), and
        sign-out genuinely revokes the session because the server holds it (SEC-10).

        Browser clients must send `credentials: "include"` on every request.

  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: { type: string, format: uuid }

    RepoId:
      name: repo_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The connected repository's identifier.
    ScanId:
      name: scan_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        The analysis attempt's identifier, as returned by `POST …/scan`. Every
        attempt has one, including attempts that end in `error` or `cancelled` —
        only successful ones go on to produce a snapshot.

  # ── shared error responses ────────────────────────────────────────────────
  responses:
    NotAuthenticated:
      description: No valid session. The client should redirect to `/api/auth/login`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: Sign in to continue.
            code: NOT_AUTHENTICATED
    Forbidden:
      description: |
        The resource belongs to another workspace. Row-Level Security keys every
        tenant-owned table on `workspace_id` (DBR-3), so this is enforced in the
        database rather than only in application code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: You do not have access to that resource.
            code: FORBIDDEN
    NotFound:
      description: No such resource in this workspace.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: Not found.
            code: NOT_FOUND
    Conflict:
      description: The operation would violate a workspace invariant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: |
        The request body is malformed — a wrong type, a missing key, or an unknown
        category. Distinct from an out-of-range weight, which is clamped and
        accepted rather than refused.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: The request could not be processed.
            code: VALIDATION_FAILED
            errors:
              - field: weights.security
                detail: Input should be a valid number.
    RateLimited:
      description: Too many requests (SEC-12).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: Too many requests. Try again shortly.
            code: RATE_LIMITED
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
    UpstreamUnavailable:
      description: |
        A required external service — GitHub or Asgardeo — is unavailable or
        degraded (REL-06, PERF-09). Previously completed results stay readable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: An external service is temporarily unavailable.
            code: UPSTREAM_UNAVAILABLE
    ScorePending:
      description: The profile-stamped dashboard result is being prepared asynchronously.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: The dashboard score is still being prepared. Please try again shortly.
            code: SCORE_PENDING

  # ── schemas ───────────────────────────────────────────────────────────────
  schemas:

    # ---- error envelope -------------------------------------------------
    Error:
      type: object
      description: |
        Every non-2xx response in this API has this shape.

        **Clients switch on `code`, never on `detail`.** `detail` is a human
        sentence whose wording may change; `code` is a stable constant. Per SEC-16,
        `detail` never carries a stack trace, SQL, an internal hostname or any other
        implementation detail.
      required: [detail, code]
      additionalProperties: false
      properties:
        detail:
          type: string
          description: A human-readable sentence naming what failed.
          example: A scan is already running for this branch.
        code:
          $ref: '#/components/schemas/ErrorCode'
        languages:
          type: array
          description: |
            The languages GitHub reports for the repository, most code first.
            Present with `REPOSITORY_HAS_NO_JAVA` only, so the message can name
            what was found instead of guessing.
          items: { type: string }
          example: [Python, Shell]
        errors:
          type: array
          description: Field-level detail. Present on validation failures only.
          items:
            type: object
            required: [field, detail]
            additionalProperties: false
            properties:
              field:
                type: string
                description: Dotted path to the offending field.
                example: weights.security
              detail: { type: string }

    ErrorCode:
      type: string
      description: |
        The stable, machine-readable reason. New members may be added; existing
        members never change meaning.

        `WORKSPACE_REQUIRED` is deliberately **not** `401`. The session is valid
        and the identity is known; what is missing is a workspace to act in.
        Answering `401` would send the browser back to sign-in, which would
        succeed and land in exactly the same state — a loop with no exit.

        There is deliberately **no** `PROFILE_WORKSPACE_MISMATCH`. A profile or
        repository belonging to another workspace answers `NOT_FOUND`, exactly as
        an id that exists nowhere does, so no caller can tell another tenant's ids
        apart from nonsense ones.
      enum:
        - NOT_AUTHENTICATED       # 401
        - FORBIDDEN               # 403
        - NOT_FOUND               # 404
        - CONFLICT                # 409
        - INVALID_REPOSITORY_URL  # 400
        - REPOSITORY_NOT_PUBLIC   # 400
        - REPOSITORY_UNREACHABLE  # 400
        - REPOSITORY_TOO_LARGE    # 400
        - REPOSITORY_HAS_NO_JAVA  # 400
        - ALREADY_CONNECTED       # 409
        - REPOSITORY_SCAN_RUNNING # 409
        - SCAN_ALREADY_RUNNING    # 409
        - SCAN_NOT_CANCELLABLE    # 409
        - PROFILE_LIMIT_REACHED   # 409
        - PROFILE_BUILT_IN        # 409
        - PROFILE_IN_USE          # 409
        - PROFILE_NAME_CONFLICT   # 409
        - WORKSPACE_REQUIRED      # 409
        - VALIDATION_FAILED       # 422
        - RATE_LIMITED            # 429
        - UPSTREAM_UNAVAILABLE    # 503
        - SCORE_PENDING           # 503
        - INTERNAL_ERROR          # 500

    # ---- enums ----------------------------------------------------------
    Severity:
      type: string
      description: |
        How bad a finding is. **Assigned once, at detection, and never recomputed**
        (FR-8.1): the rule register fixes it for rule findings, the SATD marker
        table for SATD findings, and ML-2 assigns none because it produces no
        findings. No model and no user ever sets a severity.

        Read by exactly two consumers — the base-point lookup in scoring, and the
        badge colour in the UI — so the ranking and the badge cannot disagree.
      enum: [critical, high, medium, low]

    Source:
      type: string
      description: |
        Which detector produced the finding. **Exactly two values** (FR-8.2).

        There is no `security` source: security patterns run inside the rule engine,
        so a security finding is a `rule` finding whose `category` is `security`. A
        separate source value would correlate perfectly with the category axis and
        collapse two orthogonal axes into one.

        There is no `ml-risk` source either: ML-2 emits no findings at all, only a
        per-file risk score.
      enum: [rule, satd]

    Category:
      type: string
      description: |
        What kind of debt it is. **Exactly five values** (FR-9.3), orthogonal to
        `source` — a finding is always both *found by X* and *of type Y*.

        Four are SATDAUG comment-dataset labels, so ML-1 trains and predicts on the
        same vocabulary the product uses. `security` is the fifth and is **never
        predicted** — it is emitted by the rule engine alone.

        There is no `defect`: SATDAUG carries no `defect_debt` label, so it cannot
        be predicted and does not exist in the product.
      enum: [code-design, requirement, documentation, test, security]

    Grade:
      type: string
      description: 'A ≥ 85 · B ≥ 70 · C ≥ 55 · D ≥ 40 · E < 40.'
      enum: [A, B, C, D, E]

    FindingStatus:
      type: string
      description: |
        v1.0 is view-only: every finding is `open`. The later values exist now
        because FR-11 sums *open* finding priorities — the filter needs something to
        filter on. The v1.1 accept / resolve / false-positive actions will set them.
      enum: [open, accepted, resolved, false-positive]

    ScanStage:
      type: string
      description: |
        The pipeline stage of a running scan, in order. Each owns a band of the
        progress bar: cloning 5–25, reading_code 25–60, finding_debt 60–70,
        predicting_risk 70–85, scoring 85–97, finishing 97–100.
      enum: [cloning, reading_code, finding_debt, predicting_risk, scoring, finishing]

    ScanErrorCode:
      type: string
      description: |
        Why a scan ended in `error` (13H.1). New members may be added; existing
        members never change meaning.

        - `NO_JAVA_FILES`: the scanned branch has no `.java` files.
        - `REPOSITORY_TOO_LARGE`: the branch has more Java files or lines than
          the scan limits allow; `error` names the limit.
        - `SCAN_TIMED_OUT`: the scan, or downloading the repository, ran past
          its time limit (15 minutes for the whole scan by default).
      enum: [NO_JAVA_FILES, REPOSITORY_TOO_LARGE, SCAN_TIMED_OUT]

    ScanPhase:
      type: string
      description: |
        `idle → queued → running → done | error | cancelled`.

        `idle` is the resting state of the scan control **before** a scan; it is
        never a stored outcome. `cancelled` is a distinct terminal phase, not a
        return to `idle`, so a scan that was stopped stays distinguishable from one
        that never ran — which SP-13 needs for diagnosis and DBR-22 needs to keep a
        cancelled attempt from ever being presented as a result.
      enum: [idle, queued, running, done, error, cancelled]

    # ---- auth -----------------------------------------------------------
    Session:
      type: object
      description: |
        The signed-in user. Carries no token and no provider credential — those stay
        server-side (SEC-09).

        **Only `user_id` is guaranteed.** `workspace_id` is null for someone who
        has signed in but has no workspace yet — a real authenticated state, not a
        failure, and what `needs_workspace_setup` exists to name so the client
        never has to infer onboarding from a missing field.

        Everything below the identifiers is display detail supplied by the
        identity provider, and a provider may simply not have it: a GitHub account
        can keep its email private and need never set a display name.

        Since the application's identity is the Asgardeo subject and nothing else,
        a missing display name must not be able to fail a sign-in that otherwise
        succeeded. Clients render a fallback — the email, or initials, or a generic
        avatar — rather than assuming these are present.
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        email:
          type: [string, 'null']
          format: email
        name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
          format: uri
        workspace_id:
          type: [string, 'null']
          format: uuid
          description: |
            The tenant every request is scoped to, or null during onboarding.
            While it is null, every workspace-bound endpoint answers `409`
            `WORKSPACE_REQUIRED`; only this endpoint, the workspace list, workspace
            creation, invitation acceptance, sign-out and the public health probes
            are reachable.
        needs_workspace_setup:
          type: boolean
          default: false
          description: |
            True when the user must create or join a workspace before the
            application is usable. Exactly the inverse of `workspace_id` being
            present, stated plainly so the client branches on an intention rather
            than on a null.
        role:
          type: [string, 'null']
          enum: [org-admin, manager, developer, viewer, null]
          description: The caller's role in the active workspace; null during onboarding.
        permissions:
          type: array
          default: []
          items: { type: string }
          description: |
            What this caller may do in the active workspace, so the client can hide
            controls it would be refused anyway. **A convenience, never the
            boundary** — the API re-checks every permission on every request, and a
            client that ignored this list would gain nothing.
          examples: [[project:read, scan:start]]
        identity_provider:
          type: [string, 'null']
          description: |
            Which provider the user authenticated with inside Asgardeo — `github`,
            `google` or `local`. Display only; the application's identity is the
            Asgardeo subject, not this.
          examples: [github]

    WorkspaceSummary:
      type: object
      description: |
        One workspace as the switcher and the Workspace settings screen need it.

        `project_count` and `member_count` are derived on read rather than stored:
        both change whenever a project or a member does, and a stored copy would
        be wrong more often than right.
      required: [workspace_id, name, role, is_active]
      additionalProperties: false
      properties:
        workspace_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        description:
          type: [string, 'null']
          maxLength: 1000
        website_url:
          type: [string, 'null']
          format: uri
          maxLength: 1000
        role:
          type: string
          enum: [org-admin, manager, developer, viewer]
        is_active:
          type: boolean
          description: Whether this workspace is selected by the current session.
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
        project_count:
          type: integer
          minimum: 0
          default: 0
          description: Repositories connected to this workspace.
        member_count:
          type: integer
          minimum: 0
          default: 0
          description: Active members. Pending invitations are not counted.

    SwitchWorkspaceRequest:
      type: object
      required: [workspace_id]
      additionalProperties: false
      properties:
        workspace_id: { type: string, format: uuid }

    CreateWorkspaceRequest:
      type: object
      description: |
        Only the name is required. A workspace is identified by what the team
        calls it; the rest is decoration the Workspace screen can fill in later.
        Names are trimmed, and a description or website of only whitespace is
        stored as absent rather than as content.
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description:
          type: [string, 'null']
          maxLength: 1000
        website_url:
          type: [string, 'null']
          format: uri
          maxLength: 1000
          description: Must be a valid http(s) URL. Rejected with `422` otherwise.

    UpdateWorkspaceRequest:
      type: object
      description: |
        A **partial** update: send only what changed, so the Workspace form can
        submit the fields the user touched.

        Omitting `description` leaves it alone; sending `null` clears it. Those are
        different intentions and the contract keeps them different — collapsing
        them would make "clear this" unexpressible.
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description:
          type: [string, 'null']
          maxLength: 1000
        website_url:
          type: [string, 'null']
          format: uri
          maxLength: 1000

    Role:
      type: string
      enum: [org-admin, manager, developer, viewer]

    Member:
      type: object
      required: [membership_id, user_id, role, status]
      additionalProperties: false
      properties:
        membership_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: [string, 'null'], format: email }
        name: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, inactive, invited] }

    Invitation:
      type: object
      required: [invitation_id, email, role, expires_at]
      additionalProperties: false
      properties:
        invitation_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        expires_at: { type: string, format: date-time }

    MemberList:
      type: object
      required: [members, pending_invitations]
      additionalProperties: false
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        pending_invitations:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }

    CreateInvitationRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        expires_in_hours: { type: integer, minimum: 1, maximum: 168, default: 72 }

    CreatedInvitation:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [invitation_url]
          properties:
            invitation_url: { type: string, format: uri }

    AcceptInvitationRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 32, maxLength: 512 }

    AcceptedInvitation:
      type: object
      required: [workspace_id, membership_id, role]
      additionalProperties: false
      properties:
        workspace_id: { type: string, format: uuid }
        membership_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }

    ChangeMemberRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/Role' }

    # ---- projects -------------------------------------------------------
    ConnectRepoRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: A public repository URL.
          example: https://github.com/octocat/Hello-World

    Repo:
      type: object
      required: [id, name, owner, visibility, url, default_branch, connected_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Hello-World }
        owner: { type: string, example: octocat }
        visibility:
          type: string
          description: |
            Recorded for every repository from v1.0 - FR-3 stores it and the projects
            list displays it. What is deferred is *connecting* a private repository,
            which needs a GitHub App installation and the SEC-04/SEC-06 authorization
            controls: that is **v2**, not v1.1.
          enum: [public, private]
        url: { type: string, format: uri }
        default_branch: { type: string, example: main }
        connected_at: { type: string, format: date-time }
        latest_health:
          description: |
            A derived hint for the projects list. **Absent** until the project has
            at least one successful scan — absent means "not yet scanned", which is
            a different thing from a health score of zero.
          oneOf:
            - $ref: '#/components/schemas/LatestHealth'
            - type: 'null'

    LatestHealth:
      type: object
      required: [score, grade, delta]
      additionalProperties: false
      properties:
        score: { type: number, minimum: 0, maximum: 100 }
        grade: { $ref: '#/components/schemas/Grade' }
        delta:
          type: number
          description: Change since the previous snapshot, both scored under the active profile.

    Branch:
      type: object
      required: [name, is_default]
      additionalProperties: false
      properties:
        name: { type: string, example: main }
        is_default: { type: boolean }
        head_commit_sha:
          type: [string, 'null']
          description: Full 40-character SHA. The UI shows the first seven.
          example: 9fceb02d0ae598e95dc970b74767f19372d61af8
        head_commit_at:
          type: [string, 'null']
          format: date-time

    # ---- scans ----------------------------------------------------------
    StartScanRequest:
      type: object
      required: [branch]
      additionalProperties: false
      properties:
        branch: { type: string, example: main }

    ScanStatus:
      type: object
      description: |
        The scan-button state machine. `phase` comes from PostgreSQL and `progress`
        from Redis — see `GET …/scan/{scan_id}` for why they live in different
        stores.
      required: [scan_id, phase, progress]
      additionalProperties: false
      properties:
        scan_id: { type: string, format: uuid }
        phase: { $ref: '#/components/schemas/ScanPhase' }
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Meaningful while `phase` is `running`; otherwise 0 or 100.
        branch: { type: [string, 'null'] }
        commit_sha:
          type: [string, 'null']
          description: The commit this scan is analysing.
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        error:
          type: [string, 'null']
          description: |
            Present only when `phase` is `error`. Stored on the attempt row, not
            merely logged, so a user-reported failure is diagnosable from the
            database alone (SP-13).
        error_code:
          description: |
            Why the scan failed, when the reason is one the user can act on.
            Present only when `phase` is `error`; null for an unexpected failure,
            where `error` alone explains it. Clients choose their message by this
            code; `error` carries the specific numbers (for example the limit
            that was exceeded).
          oneOf:
            - $ref: '#/components/schemas/ScanErrorCode'
            - type: 'null'
        stage:
          description: |
            Which pipeline stage a running scan is in (13H.4). Present only while
            `phase` is `running`, and null when the worker has not reported one.
            Additive: a client that ignores it still has `progress`.
          oneOf:
            - $ref: '#/components/schemas/ScanStage'
            - type: 'null'
        files_done:
          type: [integer, 'null']
          minimum: 0
          description: Java files read so far. Only during `reading_code`.
        files_total:
          type: [integer, 'null']
          minimum: 0
          description: Java files this scan will read. Only during `reading_code`.
        typical_seconds:
          type: [integer, 'null']
          minimum: 0
          description: |
            Median duration of this repository's last few finished scans, for
            "Usually about 2 min". Null before its first finished scan.

    ScanSummary:
      type: object
      description: One row in the Scan-History view (FR-19).
      required: [snapshot_id, scan_id, branch, commit_sha, scanned_at, finding_count, health_score, grade, delta]
      additionalProperties: false
      properties:
        snapshot_id:
          type: string
          format: uuid
          description: Pass to `GET …/health?snapshot_id=` to load it into the dashboard.
        scan_id:
          type: string
          format: uuid
          description: The analysis attempt that produced this snapshot.
        branch: { type: string }
        commit_sha: { type: string }
        scanned_at: { type: string, format: date-time }
        finding_count:
          type: integer
          minimum: 0
          description: Stored fact.
        health_score:
          type: number
          minimum: 0
          maximum: 100
          description: Derived on this request.
        grade: { $ref: '#/components/schemas/Grade' }
        delta:
          type: number
          description: Versus the previous snapshot, both under the active profile.

    # ---- dashboard ------------------------------------------------------
    Finding:
      type: object
      description: |
        One row in the Refactor-First list, and the subject of the finding-detail
        panel. The atomic unit of output.

        `severity` and `category` are **stored facts** written at detection.
        `priority` is **derived** on this request under the active profile — it is
        included as the sort key the list is already ordered by, so the client never
        re-sorts and the badge can never disagree with the ranking.
      required: [fingerprint, source, category, severity, file, line, reason, status, priority, pinned_by_floor]
      additionalProperties: false
      properties:
        fingerprint:
          type: string
          description: |
            Stable across scans, so a finding can be tracked over time and
            deduplicated (DBR-15).
        source: { $ref: '#/components/schemas/Source' }
        category: { $ref: '#/components/schemas/Category' }
        severity: { $ref: '#/components/schemas/Severity' }
        file: { type: string, example: src/main/java/com/acme/Billing.java }
        line: { type: integer, minimum: 1 }
        symbol:
          type: [string, 'null']
          description: The method or class the finding sits on. Null for file-scoped rules.
          example: charge
        reason:
          type: string
          description: |
            A one-line, plain-English explanation produced by a **string template**,
            never by text generation (FR-16). Reliable, instant, and incapable of
            hallucinating.
          example: charge() has cyclomatic complexity 18, over the limit of 15 - split it into smaller functions.
        status: { $ref: '#/components/schemas/FindingStatus' }
        priority:
          type: number
          description: |
            `base_points(severity) × category_weight × source_trust × churn_factor ×
            risk_factor` (FR-11). Derived, never stored. The list is returned already
            sorted by this, descending.
        pinned_by_floor:
          type: boolean
          default: false
          description: |
            True when this finding is held in the visible list by the
            **critical-security visibility floor** (FR-24) rather than by its
            computed priority. Lets the UI explain why a row is present even at the
            minimum `security` weight of 0.1.
        rule_id:
          type: [string, 'null']
          description: Which rule fired. Rule findings only.
          example: complex-function
        metric_value:
          type: [number, 'null']
          description: The measured value. Rule findings only.
          example: 18
        threshold:
          type: [number, 'null']
          description: The limit crossed. Rule findings only.
          example: 15
        comment_text:
          type: [string, 'null']
          description: |
            The developer's own words, quoted as evidence. SATD findings only. Only
            the comment that produced the finding is stored — never the surrounding
            source (DBR-27).
          example: '// FIXME: this is not thread-safe'
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: ML-1's confidence in the predicted category. SATD findings only.

    FileScore:
      type: object
      description: Per-file numbers behind the heat map and the hotspot ranking.
      required: [file, debt_score, risk_score]
      additionalProperties: false
      properties:
        file: { type: string }
        debt_score:
          type: number
          description: Σ of the priorities of the open findings in this file. Derived.
        risk_score:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: |
            ML-2's bug-proneness estimate — a **stored fact**, not derived.

            **`null` means the ML service was unreachable** when this snapshot was
            taken, so no estimate exists. That is different from `0.0`, which is a
            measured "this file looks safe". Render `null` as "not assessed" and
            never as a zero-risk badge.

            A risky file with no findings still contributes no debt: risk enters
            scoring only as a bounded multiplier on findings that already exist
            (FR-10).

    TreeNode:
      type: object
      description: |
        A node in the hotspot file tree (FR-18). Folder values aggregate the stored
        file scores beneath them, so drilling in re-aggregates a subtree by summing
        numbers already in memory — no re-scan and no second query.
      required: [path, name, type, health_score, grade, debt_score]
      additionalProperties: false
      properties:
        path: { type: string, example: src/main/java/com/acme }
        name: { type: string, example: acme }
        type: { type: string, enum: [file, folder] }
        health_score:
          type: number
          minimum: 0
          maximum: 100
          description: Drives the red → amber → green tint.
        grade: { $ref: '#/components/schemas/Grade' }
        debt_score: { type: number }
        risk_score:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Files only, and null when unassessed. See `FileScore.risk_score`.
        children:
          type: [array, 'null']
          description: Folders only.
          items: { $ref: '#/components/schemas/TreeNode' }

    HealthPoint:
      type: object
      description: |
        One point on the trend chart (FR-14). **Every point on a line is computed
        under the same, currently active profile**, so a profile change redraws the
        entire history and every point stays comparable with every other. A line
        whose points came from different profiles would be unreadable: you could not
        tell a code change from a settings change.
      required: [t, score]
      additionalProperties: false
      properties:
        t: { type: string, format: date-time }
        score: { type: number, minimum: 0, maximum: 100 }
        commit_sha: { type: [string, 'null'] }

    CategoryBreakdownItem:
      type: object
      description: |
        One slice of the category pie (FR-13). `count` is a plain query over stored
        rows; `debt` is weighted by the active profile — so the two move
        independently, and a category can hold many findings but little debt.
      required: [category, count, debt]
      additionalProperties: false
      properties:
        category: { $ref: '#/components/schemas/Category' }
        count: { type: integer, minimum: 0 }
        debt: { type: number }

    HealthReport:
      type: object
      description: |
        The whole dashboard in one response — all six outputs of SRS Appendix B.

        Everything numeric here is derived on this request under the active profile.
        The client renders; it computes nothing.
      required:
        [snapshot_id, repo_id, branch, commit_sha, scanned_at, health_score, grade,
         delta, red_issue_count, profile, history, tree, file_scores, findings,
         category_breakdown]
      additionalProperties: false
      properties:
        snapshot_id: { type: string, format: uuid }
        repo_id: { type: string, format: uuid }
        branch: { type: string }
        commit_sha:
          type: string
          description: The commit analysed. The UI shows the first seven characters.
        scanned_at: { type: string, format: date-time }
        health_score: { type: number, minimum: 0, maximum: 100 }
        grade: { $ref: '#/components/schemas/Grade' }
        delta:
          type: number
          description: |
            Versus the previous snapshot, **both scored under the same active
            profile** — so it always reflects a change in the code, never a change
            in settings.
        red_issue_count:
          type: integer
          minimum: 0
          description: Critical + high, for the health-card summary.
        profile:
          type: string
          description: |
            The active profile's name, shown on the trend chart. Without the label,
            the chart changing shape after a profile switch reads as a defect
            (FR-14).
          example: Balanced
        model_version:
          type: [string, 'null']
          description: |
            The ML model version that produced this snapshot (AI-03, DBR-18). Null
            when the snapshot was taken in degraded mode with no ML available.
        history:
          type: array
          items: { $ref: '#/components/schemas/HealthPoint' }
        tree:
          type: array
          items: { $ref: '#/components/schemas/TreeNode' }
        file_scores:
          type: array
          items: { $ref: '#/components/schemas/FileScore' }
        findings:
          type: array
          description: The Refactor-First list, already sorted by `priority` descending.
          items: { $ref: '#/components/schemas/Finding' }
        category_breakdown:
          type: array
          items: { $ref: '#/components/schemas/CategoryBreakdownItem' }

    # ---- profiles -------------------------------------------------------
    CategoryWeights:
      type: object
      description: |
        One weight per `Category` value — five, no more and no fewer. Modelled as
        named fields rather than a free-form map so that a client omitting one, or
        inventing a sixth, is rejected at the edge instead of producing a missing-key
        failure deep inside the scoring engine.

        Bounds are documented here, but **the server is the enforcement point**: it
        clamps on write and returns what it stored. The client-side clamp is a
        usability affordance, not the rule.
      required: [security, code_design, requirement, documentation, test]
      additionalProperties: false
      properties:
        security: { type: number, minimum: 0.1, maximum: 3.0, default: 1.0 }
        code_design: { type: number, minimum: 0.1, maximum: 3.0, default: 1.0 }
        requirement: { type: number, minimum: 0.1, maximum: 3.0, default: 1.0 }
        documentation: { type: number, minimum: 0.1, maximum: 3.0, default: 1.0 }
        test: { type: number, minimum: 0.1, maximum: 3.0, default: 1.0 }

    ApplyProfileRequest:
      type: object
      description: |
        The complete profile — six numbers. Never a delta; that is what makes the
        `PUT` idempotent.
      required: [weights, trust_s]
      additionalProperties: false
      properties:
        name:
          type: [string, 'null']
          description: |
            Optional label. Sending a preset's name records which preset the values
            came from; omit it for a custom profile.
        weights: { $ref: '#/components/schemas/CategoryWeights' }
        trust_s:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: |
            The trust slider `s`. `0` = trust the model, `1` = trust the rules.
            Scoring derives `rule_trust = 0.5 + s` and `ml_trust = 1.5 − s` from it
            (FR-11).

            **Security findings are excluded**: `source_trust` is fixed at 1.0 for
            the `security` category, so no position of this slider can de-weight
            them (FR-24 mechanism 2).

    CategoryWeightsPatch:
      type: object
      description: |
        The same five weights, every one optional. `PATCH` carries only what
        changed, so an omitted weight keeps its stored value. `null` is not the
        same as omitted and is rejected: there is no profile with no security
        weight.
      additionalProperties: false
      properties:
        security: { type: number, minimum: 0.1, maximum: 3.0 }
        code_design: { type: number, minimum: 0.1, maximum: 3.0 }
        requirement: { type: number, minimum: 0.1, maximum: 3.0 }
        documentation: { type: number, minimum: 0.1, maximum: 3.0 }
        test: { type: number, minimum: 0.1, maximum: 3.0 }

    CreateProfileRequest:
      type: object
      description: |
        A new custom profile for the workspace pool. `name` is required here and
        optional on the legacy apply endpoint, because a profile that joins a pool
        has to be tellable apart from the other five.
      required: [name, weights, trust_s]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200, example: Release gate }
        weights: { $ref: '#/components/schemas/CategoryWeights' }
        trust_s: { type: number, minimum: 0, maximum: 1, default: 0.5 }

    UpdateProfileRequest:
      type: object
      description: |
        A partial update. Every field is optional and an omitted one is left
        alone; an empty body is accepted and changes nothing, which keeps a retry
        harmless. Out-of-range values are clamped, exactly as on create.
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        weights: { $ref: '#/components/schemas/CategoryWeightsPatch' }
        trust_s: { type: number, minimum: 0, maximum: 1 }

    SelectProfileRequest:
      type: object
      description: |
        Carries the whole selection rather than a delta, so re-sending it is
        idempotent — the second `PUT` of the same id changes nothing.
      required: [profile_id]
      additionalProperties: false
      properties:
        profile_id: { type: string, format: uuid }

    ProjectProfile:
      type: object
      description: |
        Which profile one project is scored with, and where that came from.
        `effective` and `workspace_default` are both always present so the web can
        render "inheriting Balanced" without a second request, and `override` is
        null exactly when `inherited` is true.
      required: [repo_id, inherited, effective, workspace_default]
      additionalProperties: false
      properties:
        repo_id: { type: string, format: uuid }
        inherited:
          type: boolean
          description: True when this project has no override of its own.
        effective:
          allOf: [{ $ref: '#/components/schemas/ScoreProfile' }]
          description: The profile actually used — the override, else the default.
        workspace_default: { $ref: '#/components/schemas/ScoreProfile' }
        override:
          oneOf:
            - { $ref: '#/components/schemas/ScoreProfile' }
            - { type: 'null' }
          description: The explicit choice for this project, or null.

    ScoreProfile:
      type: object
      description: A stored profile, as returned after clamping.
      required: [id, name, weights, trust_s, is_preset, is_active, usage_count, editable]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Balanced }
        weights: { $ref: '#/components/schemas/CategoryWeights' }
        trust_s: { type: number, minimum: 0, maximum: 1 }
        is_preset:
          type: boolean
          description: Presets are read-only templates that seed the sliders.
        is_active:
          type: boolean
          description: |
            Whether this is the **workspace default** — the profile every project
            without an explicit override is scored with.

            One row per workspace in `WORKSPACE_PROFILE_SETTINGS` holds that
            pointer, with `workspace_id` as its primary key, so "exactly one
            default per workspace" is the shape of the table rather than a rule a
            handler has to remember. Its foreign key travels through
            `workspace_id`, which is what makes a default from another workspace
            unrepresentable, and refuses to delete a profile while it is still the
            default.
        usage_count:
          type: integer
          minimum: 0
          description: |
            How many projects name this profile explicitly. The workspace default
            is additionally in force for every project *without* an override,
            which `is_active` already says, so those are not counted here.
        editable:
          type: boolean
          description: |
            False for the three built-ins. They are refused every update and
            delete by a database trigger, not merely by this flag — the flag only
            saves the client a round trip to find that out.
