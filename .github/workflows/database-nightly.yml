name: Database performance and capacity

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-volume:
    name: PostgreSQL 16 performance and capacity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      CODESAGE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
      CODESAGE_PERF_SCALE: full
      CODESAGE_SECRET_KEY: nightly-database-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API test dependencies
        run: pip install -e ".[dev]"
      - name: Run seeded query-plan, latency, and 50-workspace capacity tests
        run: >-
          pytest -m perf -q -s
          tests/integration/test_query_performance.py
          tests/integration/test_capacity.py
