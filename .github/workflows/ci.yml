# Code Sage AI — continuous integration.
#
# What this is for, beyond catching bugs: CI does what a hosting platform does —
# check out the code fresh, install from the lockfile, build the images. Green
# means the project is portable, proven rather than assumed. If it only builds on
# one machine, that is not a deployment.
#
# One job per folder, so a red tick names the folder immediately.
#
# Images are built on every pull request and pushed only on `main`. A fork's token
# is read-only and could not push anyway, and a registry full of images from
# branches that were never merged helps nobody.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  

# A second push to the same branch makes the first run pointless. Cancel it
# rather than queueing behind it — except on main, where every commit that
# produces a published image deserves its own complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.15.1"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  deployments: write

jobs:
  # ── Frontend ───────────────────────────────────────────────────────────────
  web:
    name: web — tests, types, contract, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # --frozen-lockfile fails rather than quietly resolving different versions
      # than the ones that were tested.
      - name: Install
        run: pnpm install --frozen-lockfile

      # First, deliberately. This stops the OpenAPI contract and the generated
      # types drifting apart. The contract is the one file every folder depends
      # on, so a drift breaks everyone
      - name: Contract check — generated types match openapi.yaml
        run: pnpm gen:types:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test:run

  # ── Backend ────────────────────────────────────────────────────────────────
  api:
    name: api — tests, layer check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # `defaults.run.working-directory` applies only to `run:` steps, not
          # to `uses:` steps, so this path is from the repository root.
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # The cheapest check here, and it exists because its absence broke `main`:
      # two pull requests each added a migration with the same revision id, both
      # were green, both merged, and `alembic upgrade head` then refused to run
      # against a graph with two heads.
      #
      # Nothing else notices. The tests build a schema from ORM metadata, not
      # from the migration chain, so a broken chain stays invisible until someone
      # actually migrates — on a clean clone, or in the pre-deploy command — and
      # it reads as a database outage.
      #
      # `alembic heads` reads the versions directory and touches no database, so
      # this costs a fraction of a second and needs no services.
      - name: Migration chain has exactly one head
        run: |
          out="$(alembic heads 2>&1)"
          echo "$out"
          if printf '%s' "$out" | grep -q "present more than once"; then
            echo "::error::Two migrations declare the same revision id."
            exit 1
          fi
          n="$(alembic heads 2>/dev/null | grep -c .)"
          if [ "$n" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $n. Two branches added a migration in parallel — renumber the newer one to follow the older."
            exit 1
          fi

      # The architecture test. `lint-imports` enforces the layering rules:
      # scoring stays pure, workers never score, dependencies point downward
      # only. None of that is visible to a reviewer reading a single file, which
      # is exactly why it is a machine check. Cheap, so it runs before the tests.
      - name: Layer check (import-linter)
        run: lint-imports

      # This is deliberately separate from the general test step. The RLS
      # fixture executes `alembic upgrade head` against PostgreSQL, so a broken
      # migration cannot hide behind unit tests built from ORM metadata. The
      # fixture permits a local skip when Docker is absent, but CI=true converts
      # that condition—and every migration/setup exception—into a hard failure.
      - name: Database migrations, constraints, and tenant isolation
        run: pytest -q -rs tests/integration/test_rls.py tests/integration/test_database_constraints.py

      # -rs keeps any optional local-only skips visible in the general suite.
      - name: Tests
        run: pytest -q -rs

      # Advisory, not blocking — deliberately, and temporarily. There are 31
      # pre-existing findings in apps/api, none introduced by the change that
      # added this workflow.
      #
      # Making it blocking today would mean either editing 18 files somebody else
      # is mid-flight in, or shipping a workflow that is red on arrival and can
      # never be required by branch protection.
      #
      # To clear it: `ruff check --fix .` fixes 26 of the 31. Then delete
      # `--exit-zero` below and add this to the required checks.
      - name: Ruff (advisory — see deployment log Entry 3)
        run: |
          ruff check . --exit-zero --output-format=concise
          echo "---"
          echo "Advisory only. Count: $(ruff check . --exit-zero --output-format=concise | grep -c ':' || true)"

  # ── Model service ──────────────────────────────────────────────────────────
  ml:
    name: ml — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/ml/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # The `|| [ $? -eq 5 ]` mask that used to be here treated "no tests
      # collected" as a pass, back when the suite was empty. Now it would only
      # hide an accidentally empty suite — the failure most worth seeing.
      - name: Tests
        run: pytest -q -rs

      - name: Ruff (advisory)
        run: ruff check . --exit-zero --output-format=concise

  # ── Images ─────────────────────────────────────────────────────────────────
  images:
    # ⚠️ THIS NAME MUST BE STATIC AND UNIQUE PER MATRIX LEG, and both halves of
    # that matter to branch protection:
    #
    #   STATIC — it used to read `images — build${{ ... 'and publish' ... }}`, so
    #   the check was called "images — build" on a pull request and "images —
    #   build and publish" on main. A ruleset requires a check BY NAME, and a
    #   name that only exists on main can never be satisfied by a pull request.
    #
    #   UNIQUE — all three legs shared one name, so "images — build" was three
    #   check runs called the same thing. When names collide GitHub resolves the
    #   requirement against one of them, so a failing `ml` build could sit behind
    #   a passing `web` build and the merge would still be allowed.
    #
    # `images — web` / `images — api` / `images — ml` are stable across events
    # and name the failing folder on sight, like the three jobs above.
    name: images — ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Do not spend registry space or six minutes of runner time on a commit
    # whose tests are already red.
    needs: [web, api, ml]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: apps/web
          - name: api
            context: apps/api
          - name: ml
            context: apps/ml

    steps:
      - uses: actions/checkout@v4

      # Needed for cache-from/to type=gha and for build-args to work the same
      # way they do locally.
      - uses: docker/setup-buildx-action@v3

      # Only on main. A pull request neither needs nor is allowed to publish.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags and OCI labels. It also lowercases the image name, which
      # matters: the repository is `JPabasara/CodeSage-AI` and GHCR rejects
      # uppercase, so a hand-written `ghcr.io/${{ github.repository }}` fails.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }} ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every run reinstalls from scratch. pnpm alone spends
          # 5m19s on its supply-chain policy check before downloading anything.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # ⚠️ ONLY MEANINGFUL FOR `web`, and harmless for the other two.
          # Next.js freezes NEXT_PUBLIC_* into the JavaScript at BUILD time, so
          # the published web image points at whatever this says — a runtime
          # environment variable on Railway cannot change it.
          #
          # Set the repository variable WEB_API_BASE_URL to the real API
          # address, then re-run this workflow. Until then the published image
          # is only good for local use.
          #   Settings → Secrets and variables → Actions → Variables
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.WEB_API_BASE_URL || 'http://localhost:8000' }}

  # ── Deploy ─────────────────────────────────────────────────────────────────
  # CI publishes the images, then tells Railway to pull them.
  #
  # NOT by pointing Railway at this repository — that would make Railway build the
  # code itself, discarding the images the job above just built and tested, so
  # what runs would not be what passed. The artefact CI built is the artefact
  # that runs.
  deploy:
    name: deploy — Railway
    runs-on: ubuntu-latest
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Scopes the token to this environment and lists every deploy on the
    # repository's Deployments tab — a free audit trail.
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install the Railway CLI
        run: npm i -g @railway/cli

      # api first, and alone. Its pre-deploy command runs `alembic upgrade head`,
      # and the schema must be current before a worker reads it. A failure here
      # stops everything below — which is the point: the live site once returned
      # 500 for exactly this reason, because a merged migration had never reached
      # the database.
      - name: Deploy api (runs migrations)
        run: railway redeploy --service api --yes

      - name: Deploy worker
        run: railway redeploy --service worker --yes

      - name: Deploy web
        run: railway redeploy --service web --yes

      # Nothing calls ml yet, so a failure here must not paint the deploy red.
      - name: Deploy ml
        continue-on-error: true
        run: railway redeploy --service ml --yes
