# Code Sage AI — continuous integration (team plan §6, steps J0.5–J0.7).
#
# WHAT THIS IS FOR, beyond catching bugs:
#
#   CI does exactly what a hosting platform does — check out the code fresh,
#   install from the lockfile, build the images. If it is green, the project is
#   portable, proven rather than assumed. If it only builds on Janidu's laptop,
#   we do not have a deployment; we have a laptop. (Team plan §5.)
#
# Job layout — one job per folder, so a red tick names its owner immediately:
#
#   web     → Janidu    api → Chamodh    ml → Nathasha    images → Janidu
#
# Images are BUILT on every pull request and PUSHED only on `main`. A pull
# request from a fork has a read-only token and could not push anyway, and we do
# not want a registry full of images from branches that were never merged.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  

# A second push to the same branch makes the first run pointless. Cancel it
# rather than queueing behind it — except on main, where every commit that
# produces a published image deserves its own complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.15.1"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  # ── Frontend ───────────────────────────────────────────────────────────────
  web:
    name: web — tests, types, contract, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # --frozen-lockfile fails rather than quietly resolving different versions
      # than the ones that were tested.
      - name: Install
        run: pnpm install --frozen-lockfile

      # FIRST, deliberately. This is the check that stops docs/api/openapi.yaml
      # and src/lib/types/api.ts drifting apart — the contract is the only file
      # all three of us depend on, so a drift here breaks everyone, and it is
      # cheaper to learn that before spending three minutes on tests.
      - name: Contract check — generated types match openapi.yaml
        run: pnpm gen:types:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test:run

  # ── Backend ────────────────────────────────────────────────────────────────
  api:
    name: api — tests, layer check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # `defaults.run.working-directory` applies only to `run:` steps, not
          # to `uses:` steps, so this path is from the repository root.
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # THE ARCHITECTURE TEST. `lint-imports` enforces the SAD's layering rules:
      # scoring stays pure, workers never score, dependencies point downward
      # only. None of that is visible to a reviewer reading a single file, which
      # is exactly why it is a machine check. Cheap, so it runs before the tests.
      - name: Layer check (import-linter)
        run: lint-imports

      # -rs prints WHY anything skipped. That matters more than usual here: the
      # six Row-Level Security tests currently skip, and a silent skip in a
      # security test is a green tick that proves nothing. See the deployment
      # log, Entry 3.
      - name: Tests
        run: pytest -q -rs

      # ADVISORY, NOT BLOCKING — and that is a deliberate, temporary decision.
      # There are 31 pre-existing ruff findings in apps/api, none of them
      # introduced by the pull request that added this workflow, and apps/api is
      # Chamodh's folder (team plan §1: only touch your own folder).
      #
      # Making it blocking today would mean either editing 18 of his files while
      # he is mid-flight — the exact merge mess §2 exists to prevent — or
      # shipping a workflow that is red on arrival and can never be required by
      # branch protection.
      #
      # TO CLEAR IT (Chamodh): `ruff check --fix .` fixes 26 of the 31.
      # Then delete `--exit-zero` below and add this to the required checks.
      - name: Ruff (advisory — see deployment log Entry 3)
        run: |
          ruff check . --exit-zero --output-format=concise
          echo "---"
          echo "Advisory only. Count: $(ruff check . --exit-zero --output-format=concise | grep -c ':' || true)"

  # ── Model service ──────────────────────────────────────────────────────────
  ml:
    name: ml — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/ml/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # apps/ml/tests currently holds only __init__.py, and pytest exits 5 —
      # "no tests collected" — which would fail the job. Nathasha's A1.4 adds
      # the real tests; until then, treat an empty suite as a pass rather than
      # blocking the whole pipeline on work that is legitimately not done yet.
      # Any OTHER non-zero exit is still a failure.
      - name: Tests
        run: |
          pytest -q -rs || [ $? -eq 5 ]

      - name: Ruff (advisory)
        run: ruff check . --exit-zero --output-format=concise

  # ── Images (J0.6 build, J0.7 publish) ──────────────────────────────────────
  images:
    name: images — build${{ github.event_name == 'push' && ' and publish' || '' }}
    runs-on: ubuntu-latest
    # Do not spend registry space or six minutes of runner time on a commit
    # whose tests are already red.
    needs: [web, api, ml]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: apps/web
          - name: api
            context: apps/api
          - name: ml
            context: apps/ml

    steps:
      - uses: actions/checkout@v4

      # Needed for cache-from/to type=gha and for build-args to work the same
      # way they do locally.
      - uses: docker/setup-buildx-action@v3

      # Only on main. A pull request neither needs nor is allowed to publish.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags and OCI labels. It also lowercases the image name, which
      # matters: the repository is `JPabasara/CodeSage-AI` and GHCR rejects
      # uppercase, so a hand-written `ghcr.io/${{ github.repository }}` fails.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }} ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every run reinstalls from scratch. pnpm alone spends
          # 5m19s on its supply-chain policy check before downloading anything.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # ⚠️ ONLY MEANINGFUL FOR `web`, and harmless for the other two.
          # Next.js freezes NEXT_PUBLIC_* into the JavaScript at BUILD time, so
          # the published web image points at whatever this says — a runtime
          # environment variable on Railway cannot change it.
          #
          # Set the repository variable WEB_API_BASE_URL once Railway gives us
          # a real API address (J1.4), then re-run this workflow. Until then the
          # published image is only good for local use.
          #   Settings → Secrets and variables → Actions → Variables
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.WEB_API_BASE_URL || 'http://localhost:8000' }}
