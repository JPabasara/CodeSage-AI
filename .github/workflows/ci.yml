
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.15.1"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  deployments: write

jobs:
  web:
    name: web — tests, types, contract, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Contract check — generated types match openapi.yaml
        run: pnpm gen:types:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test:run

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

  api:
    name: api — tests, layer check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install PMD 7.27.0
        run: |
          mkdir -p ../../.tmp/pmd-smoke
          curl --fail --location --retry 3 \
            --output /tmp/pmd-dist-7.27.0-bin.zip \
            https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.27.0/pmd-dist-7.27.0-bin.zip
          echo "4ae396ffaf2b0d3ef0b73a10b2925e77066f73d57a4ce9078c60e7302bcddec9  /tmp/pmd-dist-7.27.0-bin.zip" | sha256sum --check
          unzip -q /tmp/pmd-dist-7.27.0-bin.zip -d ../../.tmp/pmd-smoke
          ../../.tmp/pmd-smoke/pmd-bin-7.27.0/bin/pmd --version

      - name: Install
        run: pip install -e ".[dev]"

      - name: Migration chain has exactly one head
        run: |
          out="$(alembic heads 2>&1)"
          echo "$out"
          if printf '%s' "$out" | grep -q "present more than once"; then
            echo "::error::Two migrations declare the same revision id."
            exit 1
          fi
          n="$(alembic heads 2>/dev/null | grep -c .)"
          if [ "$n" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $n. Two branches added a migration in parallel — renumber the newer one to follow the older."
            exit 1
          fi

      - name: Layer check (import-linter)
        run: lint-imports

      - name: Database migrations, constraints, and tenant isolation
        run: pytest -q -rs tests/integration/test_rls.py tests/integration/test_database_constraints.py

      - name: Tests
        run: pytest -q -rs

      - name: Ruff (advisory — see deployment log Entry 3)
        run: |
          ruff check . --exit-zero --output-format=concise
          echo "---"
          echo "Advisory only. Count: $(ruff check . --exit-zero --output-format=concise | grep -c ':' || true)"

  ml:
    name: ml — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/ml/pyproject.toml

      - name: Install
        run: pip install -e ".[dev,training]"

      - name: Tests
        run: pytest -q -rs

      - name: Ruff (advisory)
        run: ruff check . --exit-zero --output-format=concise

  images:
    name: images — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [web, api, ml]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: apps/web
          - name: api
            context: apps/api
          - name: ml
            context: apps/ml

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr
            type=raw,value=k3s-sha-${{ github.sha }},enable=${{ matrix.name == 'web' }}

      - name: Railway fallback web image tags
        if: matrix.name == 'web'
        id: railway-web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=railway,enable={{is_default_branch}}
            type=raw,value=railway-sha-${{ github.sha }}

      - name: Build${{ env.PUBLISH == 'true' && ' and push' || '' }} ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.WEB_API_BASE_URL || 'https://api.codesageai.dev' }}
            NEXT_PUBLIC_SESSION_COOKIE_NAME=codesage_session

      - name: Build${{ env.PUBLISH == 'true' && ' and push' || '' }} Railway fallback web
        if: matrix.name == 'web'
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.railway-web-meta.outputs.tags }}
          labels: ${{ steps.railway-web-meta.outputs.labels }}
          cache-from: type=gha,scope=web-railway
          cache-to: type=gha,mode=max,scope=web-railway
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.RAILWAY_WEB_API_BASE_URL || 'https://api.railway.codesageai.dev' }}
            NEXT_PUBLIC_SESSION_COOKIE_NAME=${{ vars.RAILWAY_WEB_SESSION_COOKIE_NAME || 'codesage_session_railway' }}

  deploy-staging:
    name: deploy — Railway staging
    runs-on: ubuntu-latest
    needs: [images]
    # Railway staging is retired (trial ended); production deploys straight to k3s.
    if: false
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install the Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy api (runs migrations)
        run: railway redeploy --service api --yes

      - name: Deploy ml
        run: railway redeploy --service ml --yes

      - name: Deploy worker
        run: railway redeploy --service worker --yes

      - name: Deploy score-worker
        run: railway redeploy --service score-worker --yes

      - name: Deploy web
        run: railway redeploy --service web --yes

  smoke-staging:
    name: smoke — Railway staging
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: false
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    outputs:
      ran: ${{ steps.gate.outputs.ran }}
    steps:
      - name: Decide whether public smoke is enabled
        id: gate
        env:
          STAGING_SMOKE_ENABLED: ${{ vars.STAGING_SMOKE_ENABLED || 'false' }}
        run: |
          if [ "$STAGING_SMOKE_ENABLED" = "true" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "Public staging smoke is disabled until Railway TLS is ready."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ran == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ran == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ran == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web test dependencies
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for Railway API health
        if: steps.gate.outputs.ran == 'true'
        env:
          DEPLOY_API_URL: https://api.railway.codesageai.dev
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$DEPLOY_API_URL/api/healthz"; then
              exit 0
            fi
            sleep 5
          done
          echo "Railway API health check did not succeed within two minutes."
          exit 1

      - name: Wait for Railway web
        if: steps.gate.outputs.ran == 'true'
        env:
          DEPLOY_WEB_URL: https://railway.codesageai.dev
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --output /dev/null "$DEPLOY_WEB_URL/"; then
              exit 0
            fi
            sleep 5
          done
          echo "Railway web did not succeed within two minutes."
          exit 1

      - name: Run deployed Railway browser smoke test
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        env:
          DEPLOY_WEB_URL: https://railway.codesageai.dev
          DEPLOY_API_URL: https://api.railway.codesageai.dev
        run: pnpm test:smoke:deployment

      - name: Upload Railway smoke evidence
        if: failure() && steps.gate.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: railway-staging-smoke-${{ github.sha }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-production:
    name: deploy — k3s production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write
    needs: [images]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      K3S_NAMESPACE: ${{ vars.K3S_NAMESPACE }}
      K3S_API_TAILNET_HOST: ${{ vars.K3S_API_TAILNET_HOST }}
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      API_IMAGE: ghcr.io/jpabasara/codesage-ai/api:sha-${{ github.sha }}
      ML_IMAGE: ghcr.io/jpabasara/codesage-ai/ml:sha-${{ github.sha }}
      WEB_IMAGE: ghcr.io/jpabasara/codesage-ai/web:k3s-sha-${{ github.sha }}
    outputs:
      deployed: ${{ steps.gate.outputs.deployed }}
    steps:
      - name: Decide whether k3s deployment is enabled
        id: gate
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED || 'false' }}
        run: |
          if [ "$PRODUCTION_DEPLOY_ENABLED" = "true" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "k3s production deployment is disabled."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.deployed == 'true'

      - name: Connect GitHub runner to k3s over Tailscale
        if: steps.gate.outputs.deployed == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:codesage-ci
          ping: ${{ vars.K3S_API_TAILNET_HOST }}

      - name: Install kubectl
        if: steps.gate.outputs.deployed == 'true'
        uses: azure/setup-kubectl@v4

      - name: Restore restricted kubeconfig
        if: steps.gate.outputs.deployed == 'true'
        run: |
          if [ -z "$K3S_API_TAILNET_HOST" ]; then
            echo "K3S_API_TAILNET_HOST must be the k3s server's Tailscale IPv4 address."
            exit 1
          fi
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "KUBECONFIG_B64 is required after secure GitHub-to-k3s access is configured."
            exit 1
          fi
          kubeconfig_path="$RUNNER_TEMP/codesage-kubeconfig"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$kubeconfig_path"
          chmod 600 "$kubeconfig_path"
          expected_server="https://${K3S_API_TAILNET_HOST}:6443"
          configured_server="$(kubectl --kubeconfig "$kubeconfig_path" config view --raw --minify -o jsonpath='{.clusters[0].cluster.server}')"
          if [ "$configured_server" != "$expected_server" ]; then
            echo "The deployer kubeconfig must use $expected_server, not a public or admin endpoint."
            exit 1
          fi
          echo "KUBECONFIG=$kubeconfig_path" >> "$GITHUB_ENV"

      - name: Verify cluster and namespace access
        if: steps.gate.outputs.deployed == 'true'
        run: |
          if [ "$K3S_NAMESPACE" != "codesageai" ]; then
            echo "K3S_NAMESPACE must be codesageai."
            exit 1
          fi
          if [ "$(kubectl -n "$K3S_NAMESPACE" auth can-i patch deployments)" != "yes" ]; then
            echo "github-deployer must be able to patch deployments."
            exit 1
          fi
          if [ "$(kubectl -n "$K3S_NAMESPACE" auth can-i get secrets)" != "no" ]; then
            echo "github-deployer must not be able to read secrets."
            exit 1
          fi
          kubectl -n "$K3S_NAMESPACE" get deployment/api

      - name: Run the migration Job for this release
        if: steps.gate.outputs.deployed == 'true'
        run: |
          short_sha="${GITHUB_SHA::12}"
          job_name="codesage-migrate-$short_sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          job_manifest="$RUNNER_TEMP/$job_name.yaml"
          sed \
            -e "s/name: codesage-migrate/name: $job_name/" \
            -e "s|ghcr.io/jpabasara/codesage-ai/api:latest|$API_IMAGE|" \
            infra/k3s/linode/migrate-job.yaml > "$job_manifest"
          kubectl -n "$K3S_NAMESPACE" create -f "$job_manifest"
          kubectl -n "$K3S_NAMESPACE" wait --for=condition=complete \
            --timeout=10m "job/$job_name"

      - name: Roll out immutable application images
        if: steps.gate.outputs.deployed == 'true'
        run: |
          kubectl -n "$K3S_NAMESPACE" set image deployment/api "api=$API_IMAGE"
          kubectl -n "$K3S_NAMESPACE" set image deployment/ml "ml=$ML_IMAGE"
          kubectl -n "$K3S_NAMESPACE" set image deployment/worker "worker=$API_IMAGE"
          kubectl -n "$K3S_NAMESPACE" set image deployment/score-worker "score-worker=$API_IMAGE"
          kubectl -n "$K3S_NAMESPACE" set image deployment/web "web=$WEB_IMAGE"

      - name: Wait for all k3s rollouts
        if: steps.gate.outputs.deployed == 'true'
        run: |
          for deployment in api ml worker score-worker web; do
            kubectl -n "$K3S_NAMESPACE" rollout status "deployment/$deployment" --timeout=10m
          done

      - name: Record deployed k3s images
        if: steps.gate.outputs.deployed == 'true'
        run: kubectl -n "$K3S_NAMESPACE" get deployments

  smoke-production:
    name: smoke — k3s production public edge
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: >-
      needs.deploy-production.result == 'success' &&
      needs.deploy-production.outputs.deployed == 'true'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Decide whether public k3s smoke is enabled
        id: gate
        env:
          PRODUCTION_PUBLIC_SMOKE_ENABLED: ${{ vars.PRODUCTION_PUBLIC_SMOKE_ENABLED || 'false' }}
        run: |
          if [ "$PRODUCTION_PUBLIC_SMOKE_ENABLED" = "true" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "Public k3s smoke is disabled until primary DNS and production TLS are ready."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ran == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ran == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ran == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web test dependencies
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for k3s public API health
        if: steps.gate.outputs.ran == 'true'
        env:
          DEPLOY_API_URL: https://api.codesageai.dev
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$DEPLOY_API_URL/api/healthz"; then
              exit 0
            fi
            sleep 5
          done
          echo "k3s public API health check did not succeed within two minutes."
          exit 1

      - name: Wait for k3s public web
        if: steps.gate.outputs.ran == 'true'
        env:
          DEPLOY_WEB_URL: https://codesageai.dev
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --output /dev/null "$DEPLOY_WEB_URL/"; then
              exit 0
            fi
            sleep 5
          done
          echo "k3s public web did not succeed within two minutes."
          exit 1

      - name: Run deployed k3s browser smoke test
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        env:
          DEPLOY_WEB_URL: https://codesageai.dev
          DEPLOY_API_URL: https://api.codesageai.dev
        run: pnpm test:smoke:deployment

      - name: Upload k3s smoke evidence
        if: failure() && steps.gate.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k3s-production-smoke-${{ github.sha }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
