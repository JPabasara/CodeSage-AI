# Code Sage AI — continuous integration.
#
# What this is for, beyond catching bugs: CI does what a hosting platform does —
# check out the code fresh, install from the lockfile, build the images. Green
# means the project is portable, proven rather than assumed. If it only builds on
# one machine, that is not a deployment.
#
# One job per folder, so a red tick names the folder immediately.
#
# Images are built on every pull request and pushed only on `main`. A fork's token
# is read-only and could not push anyway, and a registry full of images from
# branches that were never merged helps nobody.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run pointless. Cancel it
# rather than queueing behind it — except on main, where every commit that
# produces a published image deserves its own complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.15.1"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  deployments: write

jobs:
  # ── Frontend ───────────────────────────────────────────────────────────────
  web:
    name: web — tests, types, contract, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # --frozen-lockfile fails rather than quietly resolving different versions
      # than the ones that were tested.
      - name: Install
        run: pnpm install --frozen-lockfile

      # First, deliberately. This stops the OpenAPI contract and the generated
      # types drifting apart. The contract is the one file every folder depends
      # on, so a drift breaks everyone
      - name: Contract check — generated types match openapi.yaml
        run: pnpm gen:types:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test:run

  # ── Backend ────────────────────────────────────────────────────────────────
  api:
    name: api — tests, layer check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # `defaults.run.working-directory` applies only to `run:` steps, not
          # to `uses:` steps, so this path is from the repository root.
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # The cheapest check here, and it exists because its absence broke `main`:
      # two pull requests each added a migration with the same revision id, both
      # were green, both merged, and `alembic upgrade head` then refused to run
      # against a graph with two heads.
      #
      # Nothing else notices. The tests build a schema from ORM metadata, not
      # from the migration chain, so a broken chain stays invisible until someone
      # actually migrates — on a clean clone, or in the pre-deploy command — and
      # it reads as a database outage.
      #
      # `alembic heads` reads the versions directory and touches no database, so
      # this costs a fraction of a second and needs no services.
      - name: Migration chain has exactly one head
        run: |
          out="$(alembic heads 2>&1)"
          echo "$out"
          if printf '%s' "$out" | grep -q "present more than once"; then
            echo "::error::Two migrations declare the same revision id."
            exit 1
          fi
          n="$(alembic heads 2>/dev/null | grep -c .)"
          if [ "$n" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $n. Two branches added a migration in parallel — renumber the newer one to follow the older."
            exit 1
          fi

      # The architecture test. `lint-imports` enforces the layering rules:
      # scoring stays pure, workers never score, dependencies point downward
      # only. None of that is visible to a reviewer reading a single file, which
      # is exactly why it is a machine check. Cheap, so it runs before the tests.
      - name: Layer check (import-linter)
        run: lint-imports

      # This is deliberately separate from the general test step. The RLS
      # fixture executes `alembic upgrade head` against PostgreSQL, so a broken
      # migration cannot hide behind unit tests built from ORM metadata. The
      # fixture permits a local skip when Docker is absent, but CI=true converts
      # that condition—and every migration/setup exception—into a hard failure.
      - name: Database migrations, constraints, and tenant isolation
        run: pytest -q -rs tests/integration/test_rls.py tests/integration/test_database_constraints.py

      # -rs keeps any optional local-only skips visible in the general suite.
      - name: Tests
        run: pytest -q -rs

      # Advisory, not blocking — deliberately, and temporarily. There are 31
      # pre-existing findings in apps/api, none introduced by the change that
      # added this workflow.
      #
      # Making it blocking today would mean either editing 18 files somebody else
      # is mid-flight in, or shipping a workflow that is red on arrival and can
      # never be required by branch protection.
      #
      # To clear it: `ruff check --fix .` fixes 26 of the 31. Then delete
      # `--exit-zero` below and add this to the required checks.
      - name: Ruff (advisory — see deployment log Entry 3)
        run: |
          ruff check . --exit-zero --output-format=concise
          echo "---"
          echo "Advisory only. Count: $(ruff check . --exit-zero --output-format=concise | grep -c ':' || true)"

  # ── Model service ──────────────────────────────────────────────────────────
  ml:
    name: ml — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/ml/pyproject.toml

      - name: Install
        run: pip install -e ".[dev,training]"

      # The `|| [ $? -eq 5 ]` mask that used to be here treated "no tests
      # collected" as a pass, back when the suite was empty. Now it would only
      # hide an accidentally empty suite — the failure most worth seeing.
      - name: Tests
        run: pytest -q -rs

      - name: Ruff (advisory)
        run: ruff check . --exit-zero --output-format=concise

  # ── Images ─────────────────────────────────────────────────────────────────
  images:
    # ⚠️ THIS NAME MUST BE STATIC AND UNIQUE PER MATRIX LEG, and both halves of
    # that matter to branch protection:
    #
    #   STATIC — it used to read `images — build${{ ... 'and publish' ... }}`, so
    #   the check was called "images — build" on a pull request and "images —
    #   build and publish" on main. A ruleset requires a check BY NAME, and a
    #   name that only exists on main can never be satisfied by a pull request.
    #
    #   UNIQUE — all three legs shared one name, so "images — build" was three
    #   check runs called the same thing. When names collide GitHub resolves the
    #   requirement against one of them, so a failing `ml` build could sit behind
    #   a passing `web` build and the merge would still be allowed.
    #
    # `images — web` / `images — api` / `images — ml` are stable across events
    # and name the failing folder on sight, like the three jobs above.
    name: images — ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Do not spend registry space or six minutes of runner time on a commit
    # whose tests are already red.
    needs: [web, api, ml]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: apps/web
          - name: api
            context: apps/api
          - name: ml
            context: apps/ml

    steps:
      - uses: actions/checkout@v4

      # Needed for cache-from/to type=gha and for build-args to work the same
      # way they do locally.
      - uses: docker/setup-buildx-action@v3

      # Only on main. A pull request neither needs nor is allowed to publish.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags and OCI labels. It also lowercases the image name, which
      # matters: the repository is `JPabasara/CodeSage-AI` and GHCR rejects
      # uppercase, so a hand-written `ghcr.io/${{ github.repository }}` fails.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr
            type=raw,value=k3s-sha-${{ github.sha }},enable=${{ matrix.name == 'web' }}

      # The fallback cannot use the normal web image: Next.js bakes both the
      # public API address and the session-cookie name into its browser bundle.
      # These tags are emitted only for the web matrix leg, but are built on PRs
      # too so the exact production build is still proven before it is pushed.
      - name: Railway fallback web image tags
        if: matrix.name == 'web'
        id: railway-web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=railway,enable={{is_default_branch}}
            type=raw,value=railway-sha-${{ github.sha }}

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }} ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every run reinstalls from scratch. pnpm alone spends
          # 5m19s on its supply-chain policy check before downloading anything.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # ⚠️ ONLY MEANINGFUL FOR `web`, and harmless for the other two.
          # Next.js freezes NEXT_PUBLIC_* into the JavaScript at BUILD time, so
          # the published web image points at whatever this says — a runtime
          # environment variable on Railway cannot change it.
          #
          # WEB_API_BASE_URL may override the primary API address. Its default
          # is the canonical public primary API, so the image is usable without
          # adding a repository variable.
          #   Settings → Secrets and variables → Actions → Variables
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.WEB_API_BASE_URL || 'https://api.codesageai.dev' }}
            NEXT_PUBLIC_SESSION_COOKIE_NAME=codesage_session

      # A separately built frontend for Railway's permanent fallback domain.
      # After this image is published, Railway web must use `web:railway`, not
      # `web:latest`. These defaults are the correct fallback values; repository
      # variables are available only if the fallback domains ever change.
      - name: Build${{ github.event_name == 'push' && ' and push' || '' }} Railway fallback web
        if: matrix.name == 'web'
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.railway-web-meta.outputs.tags }}
          labels: ${{ steps.railway-web-meta.outputs.labels }}
          cache-from: type=gha,scope=web-railway
          cache-to: type=gha,mode=max,scope=web-railway
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.RAILWAY_WEB_API_BASE_URL || 'https://api.railway.codesageai.dev' }}
            NEXT_PUBLIC_SESSION_COOKIE_NAME=${{ vars.RAILWAY_WEB_SESSION_COOKIE_NAME || 'codesage_session_railway' }}

  # ── Deploy ─────────────────────────────────────────────────────────────────
  # CI publishes the images, then tells Railway to pull them.
  #
  # NOT by pointing Railway at this repository — that would make Railway build the
  # code itself, discarding the images the job above just built and tested, so
  # what runs would not be what passed. The artefact CI built is the artefact
  # that runs.
  deploy-staging:
    name: deploy — Railway staging
    runs-on: ubuntu-latest
    needs: [images]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # Scopes the token to this environment and lists every deploy on the
    # repository's Deployments tab — a free audit trail.
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install the Railway CLI
        run: npm i -g @railway/cli

      # api first, and alone. Its pre-deploy command runs `alembic upgrade head`,
      # and the schema must be current before a worker reads it. A failure here
      # stops everything below — which is the point: the live site once returned
      # 500 for exactly this reason, because a merged migration had never reached
      # the database.
      - name: Deploy api (runs migrations)
        run: railway redeploy --service api --yes

      - name: Deploy ml
        run: railway redeploy --service ml --yes

      # Workers call ML during a scan, so deploy ML successfully before either
      # worker is restarted against the release's images and variables.
      - name: Deploy worker
        run: railway redeploy --service worker --yes

      - name: Deploy score-worker
        run: railway redeploy --service score-worker --yes

      - name: Deploy web
        run: railway redeploy --service web --yes

  # Public browser smoke testing has to wait for Railway to verify the fallback
  # domains and issue certificates. It stays an explicit staging Environment
  # variable so an unverified domain cannot make every main deployment red.
  smoke-staging:
    name: smoke — Railway staging
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    outputs:
      ran: ${{ steps.gate.outputs.ran }}
    steps:
      - name: Decide whether public smoke is enabled
        id: gate
        env:
          STAGING_SMOKE_ENABLED: ${{ vars.STAGING_SMOKE_ENABLED || 'false' }}
        run: |
          if [ "$STAGING_SMOKE_ENABLED" = "true" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "Public staging smoke is disabled until Railway TLS is ready."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ran == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ran == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ran == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web test dependencies
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for Railway API health
        if: steps.gate.outputs.ran == 'true'
        env:
          DEPLOY_API_URL: https://api.railway.codesageai.dev
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$DEPLOY_API_URL/api/healthz"; then
              exit 0
            fi
            sleep 5
          done
          echo "Railway API health check did not succeed within two minutes."
          exit 1

      - name: Wait for Railway web
        if: steps.gate.outputs.ran == 'true'
        env:
          DEPLOY_WEB_URL: https://railway.codesageai.dev
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --output /dev/null "$DEPLOY_WEB_URL/"; then
              exit 0
            fi
            sleep 5
          done
          echo "Railway web did not succeed within two minutes."
          exit 1

      - name: Run deployed Railway browser smoke test
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        env:
          DEPLOY_WEB_URL: https://railway.codesageai.dev
          DEPLOY_API_URL: https://api.railway.codesageai.dev
        run: pnpm test:smoke:deployment

      - name: Upload Railway smoke evidence
        if: failure() && steps.gate.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: railway-staging-smoke-${{ github.sha }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Railway's browser smoke must have run and passed before this production job
  # starts. The production opt-in is evaluated in its first step, after GitHub
  # has loaded the production Environment's variables.
  deploy-production:
    name: deploy — k3s production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      # Lets the Tailscale action exchange this job's GitHub OIDC token for a
      # short-lived, tagged tailnet node. It does not grant GitHub repository
      # write access or Kubernetes credentials.
      id-token: write
    needs: [images, smoke-staging]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.smoke-staging.outputs.ran == 'true'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      K3S_NAMESPACE: ${{ vars.K3S_NAMESPACE }}
      K3S_API_TAILNET_HOST: ${{ vars.K3S_API_TAILNET_HOST }}
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      API_IMAGE: ghcr.io/jpabasara/codesage-ai/api:sha-${{ github.sha }}
      ML_IMAGE: ghcr.io/jpabasara/codesage-ai/ml:sha-${{ github.sha }}
      WEB_IMAGE: ghcr.io/jpabasara/codesage-ai/web:k3s-sha-${{ github.sha }}
    outputs:
      deployed: ${{ steps.gate.outputs.deployed }}
    steps:
      - name: Decide whether k3s deployment is enabled
        id: gate
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED || 'false' }}
        run: |
          if [ "$PRODUCTION_DEPLOY_ENABLED" = "true" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "k3s production deployment is disabled."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.deployed == 'true'

      - name: Connect GitHub runner to k3s over Tailscale
        if: steps.gate.outputs.deployed == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:codesage-ci
          # Wait for the protected k3s node before running kubectl. This avoids
          # a transient peer-propagation race immediately after authentication.
          ping: ${{ vars.K3S_API_TAILNET_HOST }}

      - name: Install kubectl
        if: steps.gate.outputs.deployed == 'true'
        uses: azure/setup-kubectl@v4

      - name: Restore restricted kubeconfig
        if: steps.gate.outputs.deployed == 'true'
        run: |
          if [ -z "$K3S_API_TAILNET_HOST" ]; then
            echo "K3S_API_TAILNET_HOST must be the k3s server's Tailscale IPv4 address."
            exit 1
          fi
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "KUBECONFIG_B64 is required after secure GitHub-to-k3s access is configured."
            exit 1
          fi
          kubeconfig_path="$RUNNER_TEMP/codesage-kubeconfig"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$kubeconfig_path"
          chmod 600 "$kubeconfig_path"
          expected_server="https://${K3S_API_TAILNET_HOST}:6443"
          configured_server="$(kubectl --kubeconfig "$kubeconfig_path" config view --raw --minify -o jsonpath='{.clusters[0].cluster.server}')"
          if [ "$configured_server" != "$expected_server" ]; then
            echo "The deployer kubeconfig must use $expected_server, not a public or admin endpoint."
            exit 1
          fi
          echo "KUBECONFIG=$kubeconfig_path" >> "$GITHUB_ENV"

      - name: Verify cluster and namespace access
        if: steps.gate.outputs.deployed == 'true'
        run: |
          if [ "$K3S_NAMESPACE" != "codesageai" ]; then
            echo "K3S_NAMESPACE must be codesageai."
            exit 1
          fi
          if [ "$(kubectl -n "$K3S_NAMESPACE" auth can-i patch deployments)" != "yes" ]; then
            echo "github-deployer must be able to patch deployments."
            exit 1
          fi
          if [ "$(kubectl -n "$K3S_NAMESPACE" auth can-i get secrets)" != "no" ]; then
            echo "github-deployer must not be able to read secrets."
            exit 1
          fi
          kubectl -n "$K3S_NAMESPACE" get deployment/api

      - name: Run the migration Job for this release
        if: steps.gate.outputs.deployed == 'true'
        run: |
          short_sha="${GITHUB_SHA::12}"
          # A workflow re-run must be able to run the migration check again.
          # Including the run ID prevents a same-SHA Job collision without
          # granting the deployer permission to delete historical Jobs.
          job_name="codesage-migrate-$short_sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          job_manifest="$RUNNER_TEMP/$job_name.yaml"
          sed \
            -e "s/name: codesage-migrate/name: $job_name/" \
            -e "s|ghcr.io/jpabasara/codesage-ai/api:latest|$API_IMAGE|" \
            infra/k3s/linode/migrate-job.yaml > "$job_manifest"
          kubectl -n "$K3S_NAMESPACE" create -f "$job_manifest"
          kubectl -n "$K3S_NAMESPACE" wait --for=condition=complete \
            --timeout=10m "job/$job_name"

      - name: Roll out immutable application images
        if: steps.gate.outputs.deployed == 'true'
        run: |
          kubectl -n "$K3S_NAMESPACE" set image deployment/api "api=$API_IMAGE"
          kubectl -n "$K3S_NAMESPACE" set image deployment/ml "ml=$ML_IMAGE"
          kubectl -n "$K3S_NAMESPACE" set image deployment/worker "worker=$API_IMAGE"
          kubectl -n "$K3S_NAMESPACE" set image deployment/score-worker "score-worker=$API_IMAGE"
          kubectl -n "$K3S_NAMESPACE" set image deployment/web "web=$WEB_IMAGE"

      - name: Wait for all k3s rollouts
        if: steps.gate.outputs.deployed == 'true'
        run: |
          for deployment in api ml worker score-worker web; do
            kubectl -n "$K3S_NAMESPACE" rollout status "deployment/$deployment" --timeout=10m
          done

      - name: Record deployed k3s images
        if: steps.gate.outputs.deployed == 'true'
        run: kubectl -n "$K3S_NAMESPACE" get deployments

  # This is enabled only after Phase 20 DNS cutover and Phase 21 production TLS
  # issuance. Before then the canonical public domains either resolve to
  # Railway or present the intentionally untrusted staging certificate.
  smoke-production:
    name: smoke — k3s production public edge
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: >-
      needs.deploy-production.result == 'success' &&
      needs.deploy-production.outputs.deployed == 'true'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Decide whether public k3s smoke is enabled
        id: gate
        env:
          PRODUCTION_PUBLIC_SMOKE_ENABLED: ${{ vars.PRODUCTION_PUBLIC_SMOKE_ENABLED || 'false' }}
        run: |
          if [ "$PRODUCTION_PUBLIC_SMOKE_ENABLED" = "true" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "Public k3s smoke is disabled until primary DNS and production TLS are ready."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ran == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ran == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ran == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web test dependencies
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for k3s public API health
        if: steps.gate.outputs.ran == 'true'
        env:
          DEPLOY_API_URL: https://api.codesageai.dev
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$DEPLOY_API_URL/api/healthz"; then
              exit 0
            fi
            sleep 5
          done
          echo "k3s public API health check did not succeed within two minutes."
          exit 1

      - name: Wait for k3s public web
        if: steps.gate.outputs.ran == 'true'
        env:
          DEPLOY_WEB_URL: https://codesageai.dev
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --output /dev/null "$DEPLOY_WEB_URL/"; then
              exit 0
            fi
            sleep 5
          done
          echo "k3s public web did not succeed within two minutes."
          exit 1

      - name: Run deployed k3s browser smoke test
        if: steps.gate.outputs.ran == 'true'
        working-directory: apps/web
        env:
          DEPLOY_WEB_URL: https://codesageai.dev
          DEPLOY_API_URL: https://api.codesageai.dev
        run: pnpm test:smoke:deployment

      - name: Upload k3s smoke evidence
        if: failure() && steps.gate.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k3s-production-smoke-${{ github.sha }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
