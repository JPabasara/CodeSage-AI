[project]
name = "codesage-api"
version = "0.1.0"
description = "Code Sage AI API process and scan workers"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "pydriller==2.10",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "testcontainers[postgres]>=4.8",
    # Starlette's TestClient prefers httpx2 and warns when it falls back to httpx.
    "httpx2>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesage_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Volume and timing checks run nightly (`pytest -m perf`), not on every PR.
addopts = "-m 'not perf'"
markers = [
    "perf: seeded-volume query plan and latency checks; nightly only",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
packages = ["codesage_api"]
strict = true

[tool.importlinter]
root_package = "codesage_api"
include_external_packages = true


[[tool.importlinter.contracts]]
name = "scoring is pure — no db, no web, no queue, no io"
type = "forbidden"
source_modules = ["codesage_api.scoring"]
forbidden_modules = [
    "codesage_api.db",
    "codesage_api.routers",
    "codesage_api.services",
    "codesage_api.tasks",
    "codesage_api.integrations",
    "sqlalchemy",
    "fastapi",
    "celery",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "scan pipeline never scores"
type = "forbidden"
source_modules = ["codesage_api.tasks.scan_pipeline", "codesage_api.extractors", "codesage_api.detection"]
forbidden_modules = [
    "codesage_api.scoring.engine",
    "codesage_api.scoring.formula",
    "codesage_api.scoring.floor",
    "codesage_api.scoring.models",
    "codesage_api.scoring.config_loader",
]

# Dependencies point downward.
[[tool.importlinter.contracts]]
name = "layers point downward only"
type = "layers"
layers = ["codesage_api.routers", "codesage_api.services", "codesage_api.db"]
