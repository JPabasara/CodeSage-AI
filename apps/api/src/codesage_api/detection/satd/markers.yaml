
markers:
  - precedence: 1
    pattern: '\b(FIXME|BUG|XXX|BROKEN|DO\s*NOT\s*(SHIP|MERGE))\b'
    severity: high
    base_points: 5
    message_template: "Self-admitted defect: '{comment_text}' - classified as {predicted_category}."

  - precedence: 2
    pattern: '\b(TODO|HACK|TEMP|TEMPORARY|WORKAROUND|KLUDGE|REFACTOR)\b'
    severity: medium
    base_points: 3
    message_template: "Self-admitted debt: '{comment_text}' - classified as {predicted_category}."

  - precedence: 3
    pattern: '\b(NOTE|REVIEW|NIT|IDEA|QUESTION|MAYBE)\b'
    severity: low
    base_points: 1
    message_template: "Self-admitted note: '{comment_text}' - classified as {predicted_category}."

# Applied when the classifier detected debt in prose alone and no marker matched.
default:
  severity: medium
  base_points: 3
  message_template: "Self-admitted debt: '{comment_text}' - classified as {predicted_category}."
