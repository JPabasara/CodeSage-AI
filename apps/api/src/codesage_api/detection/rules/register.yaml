# THE RULE REGISTER — SRS Appendix C.1 (Table 4.31), verbatim.
#
# This file is the single normative source for two requirements at once:
#   FR-8.1  every rule carries a fixed category and a fixed severity
#   FR-16   every rule carries a message template
# One row per rule closes both. The `severity` field below is the answer to
# "where does a finding's severity come from?".
#
# Nothing downstream recomputes category or severity, and no user control can
# reach them (FR-24 mechanism 1). Scoring reads severity only to look up base
# points; the UI reads it only to draw a badge.
#
# Severity is FLAT per rule in v1.0: complex-function emits Medium whether WMC is
# 16 or 45. A file simply accumulates more findings the worse it gets. Graduating
# severity by how far past the threshold a value sits is a later refinement that
# changes nothing architectural — the rule still decides, still at detection time.
#
# Two mechanisms, one engine: `metric` rules compare a CK measurement against a
# threshold, `pattern` rules match a regex or entropy test against source text.
# Security patterns run INSIDE the rule engine, which is why a security finding is
# source=rule with category=security and why `source` has no `security` value.
#
# Thresholds live here, not in code (MAINT-04): recalibration is a config change.

rules:
  # ── security patterns ──────────────────────────────────────────────────────
  - rule_id: hardcoded-secret
    category: security
    severity: critical
    base_points: 8
    mechanism: pattern
    message_template: >-
      A credential-like value is assigned to {symbol} - move it to an environment
      variable and rotate the key.

  - rule_id: sql-concat
    category: security
    severity: high
    base_points: 5
    mechanism: pattern
    message_template: >-
      SQL is built by string concatenation in {symbol}() - use a parameterised query.

  # ── metric rules (thresholds over CK output) ───────────────────────────────
  - rule_id: complex-function
    category: code-design
    severity: medium
    base_points: 3
    mechanism: metric
    metric_name: wmc
    threshold: 15
    message_template: >-
      {symbol}() has cyclomatic complexity {value}, over the limit of {threshold}
      - split it into smaller functions.

  - rule_id: long-method
    category: code-design
    severity: medium
    base_points: 3
    mechanism: metric
    metric_name: loc
    threshold: 80
    message_template: >-
      {symbol}() is {value} lines long, over the limit of {threshold} - extract
      cohesive blocks into helpers.

  - rule_id: deep-nesting
    category: code-design
    severity: medium
    base_points: 3
    mechanism: metric
    metric_name: max_nested_blocks
    threshold: 4
    message_template: >-
      {symbol}() nests {value} levels deep, over the limit of {threshold} - use
      early returns to flatten it.

  - rule_id: large-file
    category: code-design
    severity: low
    base_points: 1
    mechanism: metric
    metric_name: loc
    threshold: 800
    scope: file
    message_template: >-
      {file} is {value} lines long, over the limit of {threshold} - consider
      splitting it by responsibility.
