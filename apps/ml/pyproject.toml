[project]
name = "codesage-ml"
version = "0.1.0"
description = "Code Sage AI — ML inference service (ML-1 SATD, ML-2 bug-risk)"
requires-python = ">=3.12"

# Runtime = inference only. Training dependencies are in the `training` extra and
# are NOT installed into the deployed image (SRS AI-05).
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "numpy==2.5.3",
    "joblib==1.6.0",
]

[project.optional-dependencies]
training = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    # ML-2's labels come from mining bug-fixing commits out of repository history.
    "pydriller>=2.6",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.23",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesage_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "training"]
